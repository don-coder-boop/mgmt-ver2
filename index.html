        // Firestore에 저장 불가능한 값(함수, DOM노드, 이벤트, 순환참조) 제거
        const cleanForFirestore = (val, visited = new Set()) => {
            if (val === null || val === undefined) return val;
            if (typeof val === 'function') return null;
            if (typeof val !== 'object') return val;
            if (visited.has(val)) return '[Circular]';
            if ((typeof Node !== 'undefined' && val instanceof Node) || val === window || val === document) return null;
            if (val.nativeEvent || val._reactName) return null;
            visited.add(val);
            if (Array.isArray(val)) return val.map(item => cleanForFirestore(item, new Set(visited)));
            const out = {};
            for (const key of Object.keys(val)) {
                out[key] = cleanForFirestore(val[key], new Set(visited));
            }
            return out;
        };

        const parseCSV = (text) => {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const nextChar = text[i + 1];
                if (inQuotes) {
                    if (char === '"' && nextChar === '"') { currentField += '"'; i++; }
                    else if (char === '"') inQuotes = false;
                    else currentField += char;
                } else {
                    if (char === '"') inQuotes = true;
                    else if (char === ',') { currentRow.push(currentField); currentField = ''; }
                    else if (char === '\n' || char === '\r') {
                        if (currentField || currentRow.length > 0) { currentRow.push(currentField); rows.push(currentRow); currentRow = []; currentField = ''; }
                        if (char === '\r' && nextChar === '\n') i++;
                    } else currentField += char;
                }
            }
            if (currentField || currentRow.length > 0) { currentRow.push(currentField); rows.push(currentRow); }
            return rows;
        };

            const csvRows = [headers.join(',')];
            data.forEach(item => {
                const escape = (val) => `"${String(val || "").replace(/"/g, '""')}"`;

                    escape(item.instagramId), escape(item.name), escape(item.phone),

                    escape(item.productName), escape(item.size), escape(1), escape(item.message),

            const blob = new Blob(["\uFEFF" + csvRows.join('\n')], { type: 'text/csv;charset=utf-8;' });

            link.href = URL.createObjectURL(blob);

                    placeholder={placeholder}
                    value={localVal} 
                    onChange={e => setLocalVal(e.target.value)}
                    onBlur={() => { if (localVal !== (value || '')) onSave(localVal); }}
                />
            );
        };

        const SyncMonitor = () => (
            <div className="fixed bottom-6 right-6 bg-white border border-gray-100 p-4 shadow-2xl z-50 min-w-[180px] animate-fade-in flex items-center space-x-3">
                <div className="flex-shrink-0">
                    <Icons.Lock size={18} className="text-green-500" />
                </div>
                <div className="flex flex-col">
                    <span className="text-[9px] tracking-[0.075em] text-grey-medium uppercase font-bold">Secure Cloud Sync</span>
                    <span className="text-[8px] text-green-600 uppercase font-medium">Authenticated · Real-time</span>
                </div>
            </div>
        );

        const AdminDashboard = ({ collection: coll, securityMap, accessCodes, entries, onUpdate, onUpdateCodes, onUpdateEntry, onAddEntry, onDeleteEntry, onBulkUpdateEntries, onBack, activeSubView, setSubView, notify, onDelete, error, success }) => {
            const [selectedRows, setSelectedRows] = useState(new Set());
            const [sortConfig, setSortConfig] = useState({ key: 'submitDate', direction: 'desc' });
            const [isUploading, setIsUploading] = useState(false);
            const [draggedIdx, setDraggedIdx] = useState(null);
            const [showArchived, setShowArchived] = useState(false);
            const [selectedReportProductId, setSelectedReportProductId] = useState('');
            const [shippingSearchQuery, setShippingSearchQuery] = useState('');
            const [shippingStatusFilter, setShippingStatusFilter] = useState('All');
            const [distributionMetric, setDistributionMetric] = useState('items');

            const handleDragStart = (e, idx) => {
                setDraggedIdx(idx);
                e.dataTransfer.effectAllowed = "move";
            };

            const handleDragOver = (e, idx) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = "move";
            };

            const handleDrop = (e, targetIdx) => {
                e.preventDefault();
                if (draggedIdx === null || draggedIdx === targetIdx) return;
                const products = [...(coll.products || [])];
                const draggedItem = products[draggedIdx];
                products.splice(draggedIdx, 1);
                products.splice(targetIdx, 0, draggedItem);
                handleUpdate({ products });
                setDraggedIdx(null);
            };

            const handleDragEnd = () => {
                setDraggedIdx(null);
            };

            const subCollectionNameMain = coll.subCollectionNameMain || 'Nuuanu Main Collection';
            const subCollectionNameUnderwear = coll.subCollectionNameUnderwear || 'Nuuanu Underwear Collection';

            const handleUpdate = (u, skipNotify = false) => { 
                onUpdate(u); 
                if (!skipNotify) notify('Cloud Sync Saved', 'success'); 
            };

            const handleUpdateCodes = (codes, skipNotify = false) => {
                onUpdateCodes(codes);
                if (!skipNotify) notify('Access Codes Saved', 'success');
            };

            const isCodeGloballyUnique = (code, currentCollectionId, codesInThisCollection = []) => {
                if (!code || code.trim() === '') return true;
                const lowerCode = code.toLowerCase().trim();
                const existsInOtherCollection = Object.entries(securityMap || {}).some(([collId, codes]) => {
                    if (collId === currentCollectionId) return false;
                    return (codes || []).some(ac => ac.code && ac.code.toLowerCase().trim() === lowerCode);
                });
                if (existsInOtherCollection) return false;
                const localMatches = codesInThisCollection.filter(ac => ac.code && ac.code.toLowerCase().trim() === lowerCode);
                if (localMatches.length > 1) return false;
                return true;
            };

            const handleCodeBulkUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    const content = evt.target.result;
                    const rows = parseCSV(content);
                    if (rows.length < 2) return;
                    const newCodes = [];
                    const currentCodes = accessCodes || [];
                    for (let i = 1; i < rows.length; i++) {
                        const cols = rows[i];
                        if (!cols || cols.length < 1) continue;
                        const code = cols[0]?.trim();
                        const limitMain = parseInt(cols[1]) || 3;
                        const limitUnderwear = parseInt(cols[2]) || 2;
                        if (code) {
                            const combinedTemp = [...currentCodes, ...newCodes];
                            if (isCodeGloballyUnique(code, coll.firebaseId, [...combinedTemp, { code }])) {
                                newCodes.push({ code: code, limitMain: limitMain, limitUnderwear: limitUnderwear });
                            }
                        }
                    }
                    if (newCodes.length > 0) {
                        handleUpdateCodes([...currentCodes, ...newCodes], true);
                        notify(`${newCodes.length} codes imported`, 'success');
                    } else {
                        notify('No valid or unique codes found', 'error');
                    }
                };
                reader.readAsText(file);
                e.target.value = null;
            };

            const handleCSVUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    const content = evt.target.result;
                    const rows = parseCSV(content);
                    if (rows.length < 2) return;
                    const newProducts = [];
                    for (let i = 1; i < rows.length; i++) {
                        const cols = rows[i];
                        if (!cols || cols.length < 4) continue;
                        const [name, price, optionStr, summary, subCol] = cols;
                        let options = ['OS'];
                        const match = (optionStr || '').match(/size\{([^}]+)\}/i);
                        if (match) options = match[1].split('|');
                        
                        const subVal = (subCol || 'main').toLowerCase().trim() === 'underwear' ? 'underwear' : 'main';

                        newProducts.push({ 
                            id: generateId(), 
                            name: name || 'New Item', 
                            price: price || '0', 
                            options: options, 
                            description: summary || '', 
                            images: [],
                            subCollection: subVal
                        });
                    }
                    if (newProducts.length > 0) {
                        handleUpdate({ products: [...(coll.products || []), ...newProducts] });
                        notify(`${newProducts.length} items added`, 'success');
                    }
                };
                reader.readAsText(file);
                e.target.value = null; 
            };

            const sortedShipping = useMemo(() => {
                let data = [...entries];
                if (showArchived) {
                    data = data.filter(e => !!e.isArchived);
                } else {
                    data = data.filter(e => !e.isArchived);
                }

                if (shippingStatusFilter !== 'All') {
                    data = data.filter(e => e.status === shippingStatusFilter);
                }

                if (shippingSearchQuery.trim()) {
                    const q = shippingSearchQuery.toLowerCase().trim();
                    data = data.filter(e => 
                        String(e.instagramId || '').toLowerCase().includes(q) ||
                        String(e.name || '').toLowerCase().includes(q) ||
                        String(e.productName || '').toLowerCase().includes(q) ||
                        String(e.phone || '').toLowerCase().includes(q) ||
                        String(e.adminMemo || '').toLowerCase().includes(q) ||
                        String(e.address || '').toLowerCase().includes(q)
                    );
                }

                if (!sortConfig.key) return data;
                return data.sort((a, b) => {
                    const valA = String(a[sortConfig.key] || '').toLowerCase();
                    const valB = String(b[sortConfig.key] || '').toLowerCase();
                    if (valA < valB) return sortConfig.direction === 'asc' ? -1 : 1;
                    if (valA > valB) return sortConfig.direction === 'asc' ? 1 : -1;
                    return 0;
                });
            }, [entries, sortConfig, showArchived, shippingStatusFilter, shippingSearchQuery]);

            const handleBulkStatusChange = (newStatus) => {
                if (selectedRows.size === 0) return;
                const patch = newStatus === '배송완료' 
                    ? { status: newStatus, deliveredDate: todayStr() } 
                    : { status: newStatus };
                onBulkUpdateEntries(Array.from(selectedRows), patch);
                setSelectedRows(new Set());
                notify('상태가 일괄 변경되었습니다.', 'success');
            };

            const handleBulkArchive = (archiveBool) => {
                if (selectedRows.size === 0) return;
                onBulkUpdateEntries(Array.from(selectedRows), { isArchived: archiveBool });
                setSelectedRows(new Set());
                notify(archiveBool ? '주문이 보관 처리되었습니다.' : '주문이 복원 처리되었습니다.', 'success');
            };

            const toggleRow = (id) => {
                const next = new Set(selectedRows);
                if (next.has(id)) next.delete(id); else next.add(id);
                setSelectedRows(next);
            };

            const toggleAll = () => {
                if (selectedRows.size === sortedShipping.length && sortedShipping.length > 0) setSelectedRows(new Set());
                else setSelectedRows(new Set(sortedShipping.map(e => e.id)));
            };

            const handleSort = (key) => {
                setSortConfig(prev => ({ key, direction: prev.key === key && prev.direction === 'asc' ? 'desc' : 'asc' }));
            };

            const renderSortIcon = (key) => {
                if (sortConfig.key !== key) return <Icons.ChevronDown size={14} className="opacity-30 ml-1" />;
                return sortConfig.direction === 'asc' ? <Icons.ChevronUp size={14} className="ml-1" /> : <Icons.ChevronDown size={14} className="ml-1" />;
            };

            const truncateText = (text, len = 10) => {
                if (!text) return '';
                if (text.length <= len) return text;
                return text.substring(0, len) + '...';
            };

            const handleExport = () => {
                const dataToExport = selectedRows.size > 0 
                    ? entries.filter(e => selectedRows.has(e.id))
                    : entries;
                downloadCSV(`${coll.name}_shipments.csv`, dataToExport);
            };

            const handleCopyRow = (e) => {
                const newRow = { ...e };
                delete newRow.id;
                onAddEntry({ 
                    ...newRow, 
                    submitDate: todayStr(), 
                    status: '준비중',
                    isManual: true 
                });
                notify('행이 복사되었습니다.', 'success');
            };

            const handleDeleteRow = (id) => {
                if(confirm('Delete this record?')) {
                    onDeleteEntry(id);
                }
            };

            const handleDeleteCollection = () => {
                const input = window.prompt(`정말로 이 컬렉션을 삭제하시겠습니까? 삭제된 데이터(주문 내역 포함)는 복구할 수 없습니다.\n\n확인을 위해 컬렉션 이름 "${coll.name}" 을 그대로 입력해 주세요.`);
                if (input === null) return;
                if (input.trim() === coll.name) {
                    onDelete();
                } else {
                    notify('컬렉션 이름이 일치하지 않습니다.', 'error');
                }
            };

            const handleLookbookUpload = async (e) => {
                if (!e.target.files) return;
                setIsUploading(true);
                try {
                    const uploads = Array.from(e.target.files).map(f => uploadToCloudinary(f));
                    const urls = await Promise.all(uploads);
                    handleUpdate({ lookbookImages: [...(coll.lookbookImages || []), ...urls] });
                    notify(`${urls.length} images uploaded`, 'success');
                } catch (err) {
                    notify('Upload failed.', 'error');
                } finally {
                    setIsUploading(false);
                }
            };

            const handleProductImageUpload = async (productId, e) => {
                if (!e.target.files) return;
                setIsUploading(true);
                try {
                    const uploads = Array.from(e.target.files).map(f => uploadToCloudinary(f));
                    const urls = await Promise.all(uploads);
                    const updatedProducts = (coll.products || []).map(p => 
                        p.id === productId ? { ...p, images: [...(p.images || []), ...urls] } : p
                    );
                    handleUpdate({ products: updatedProducts });
                    notify(`${urls.length} images uploaded`, 'success');
                } catch (err) {
                    notify('Upload failed.', 'error');
                } finally {
                    setIsUploading(false);
                }
            };

            return (
                <div className="min-h-screen bg-white flex flex-col animate-fade-in">
                    <header className="border-b border-gray-100 py-8 px-12 flex justify-between items-center bg-white sticky top-0 z-40 backdrop-blur-md bg-white/90">
                        <div className="flex items-center space-x-12">
                            <button onClick={onBack} className="text-[15px] uppercase tracking-[0.075em] flex items-center hover:text-gray-400 font-bold group">
                                <Icons.ChevronLeft size={22} className="mr-2 group-hover:-translate-x-1 transition-transform" /> Back
                            </button>
                            <h2 className="text-[18px] font-bold tracking-[0.1em] uppercase">{coll.name}</h2>
                        </div>
                        <nav className="flex space-x-16">
                            {[
                                {id:'settings', label:'Settings', icon:Icons.Settings}, 
                                {id:'products', label:'Products', icon:Icons.Package}, 
                                {id:'shipping', label:'Shipping', icon:Icons.Truck}, 
                                {id:'report', label:'Dashboard', icon:Icons.Chart}
                            ].map(tab => (
                                <button key={tab.id} onClick={() => setSubView(tab.id)} className={`flex items-center space-x-3 text-[15px] uppercase tracking-[0.075em] py-2 ${activeSubView === tab.id ? 'text-black font-bold border-b-2 border-black' : 'text-grey-medium hover:text-black'}`}>
                                    <tab.icon size={20} /> <span className="hidden md:inline">{tab.label}</span>
                                </button>
                            ))}
                        </nav>
                    </header>
                    <main className="flex-1 p-12 overflow-auto">
                        {isUploading && (
                            <div className="fixed top-24 left-1/2 -translate-x-1/2 z-50 bg-black text-white px-8 py-4 flex items-center space-x-4 shadow-2xl">
                                <Icons.Loading className="animate-spin" />
                                <span className="text-[12px] font-bold uppercase tracking-normal">Syncing...</span>
                            </div>
                        )}
                        {activeSubView === 'settings' && (
                            <div className="max-w-5xl mx-auto space-y-20 py-10">
                                <section className="space-y-10">
                                    <h3 className="text-[15px] font-bold uppercase tracking-[0.1em] border-b pb-6">Global Config</h3>
                                    <div className="bg-gray-50/50 border p-8 rounded-3xl flex items-start space-x-4">
                                        <Icons.Lock size={20} className="text-green-600 flex-shrink-0 mt-0.5" />
                                        <div className="space-y-2">
                                            <p className="text-[13px] font-bold uppercase">관리자 인증은 Firebase Authentication으로 보호됩니다</p>
                                            <p className="text-[12px] text-grey-medium leading-relaxed">
                                                관리자 계정 추가/비밀번호 변경은 Firebase Console → Authentication에서 관리하세요.
                                                새 관리자 이메일은 Cloud Functions의 ADMIN_EMAILS 환경변수에도 추가한 뒤 재배포해야 합니다.
                                            </p>
                                        </div>
                                    </div>
                                </section>

                                <section className="space-y-10">
                                    <h3 className="text-[15px] font-bold uppercase tracking-[0.1em] border-b pb-6 text-black">Sub-Collection Names Setting</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-12">
                                        <div className="space-y-4">
                                            <label className="text-[12px] text-grey-medium uppercase font-bold tracking-normal">Main Category Label (or Brand Category)</label>
                                            <EditableCell className="w-full border-b-2 py-3 focus:border-black outline-none text-[16px] font-bold" value={subCollectionNameMain} onSave={val => handleUpdate({ subCollectionNameMain: val })} />
                                        </div>
                                        <div className="space-y-4">
                                            <label className="text-[12px] text-grey-medium uppercase font-bold tracking-normal">Underwear Category Label (or Alternative)</label>
                                            <EditableCell className="w-full border-b-2 py-3 focus:border-black outline-none text-[16px] font-bold" value={subCollectionNameUnderwear} onSave={val => handleUpdate({ subCollectionNameUnderwear: val })} />
                                        </div>
                                    </div>
                                </section>

                                <section className="space-y-10">
                                    <h3 className="text-[15px] font-bold uppercase tracking-[0.1em] border-b pb-6 text-black">Sub-Collection Cover Images</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-12">
                                        <div className="space-y-4">
                                            <label className="text-[12px] text-grey-medium uppercase font-bold tracking-normal">{subCollectionNameMain} Cover Image (4:5 ratio requested)</label>
                                            {coll.coverImageMain ? (
                                                <div className="relative aspect-[4/5] max-w-[240px] border">
                                                    <img src={coll.coverImageMain} className="w-full h-full object-cover" />
                                                    <button onClick={() => handleUpdate({ coverImageMain: '' })} className="absolute top-2 right-2 bg-white/80 p-2 shadow rounded-full cursor-pointer hover:bg-white"><Icons.X size={16}/></button>
                                                </div>
                                            ) : (
                                                <label className="aspect-[4/5] max-w-[240px] border-2 border-dashed flex flex-col items-center justify-center cursor-pointer hover:border-black transition-all group">
                                                    <Icons.Upload size={24} className="text-gray-300 group-hover:text-black" />
                                                    <span className="text-[10px] uppercase font-bold mt-2 text-gray-400">Upload Main Cover</span>
                                                    <input type="file" className="hidden" onChange={async (e) => {
                                                        if (!e.target.files?.[0]) return;
                                                        setIsUploading(true);
                                                        try {
                                                            const url = await uploadToCloudinary(e.target.files[0]);
                                                            handleUpdate({ coverImageMain: url });
                                                            notify('Main Cover updated', 'success');
                                                        } catch (err) {
                                                            notify('Upload failed', 'error');
                                                        } finally {
                                                            setIsUploading(false);
                                                        }
                                                    }} />
                                                </label>
                                            )}
                                        </div>
                                        <div className="space-y-4">
                                            <label className="text-[12px] text-grey-medium uppercase font-bold tracking-normal">{subCollectionNameUnderwear} Cover Image (4:5 ratio requested)</label>
                                            {coll.coverImageUnderwear ? (
                                                <div className="relative aspect-[4/5] max-w-[240px] border">
                                                    <img src={coll.coverImageUnderwear} className="w-full h-full object-cover" />
                                                    <button onClick={() => handleUpdate({ coverImageUnderwear: '' })} className="absolute top-2 right-2 bg-white/80 p-2 shadow rounded-full cursor-pointer hover:bg-white"><Icons.X size={16}/></button>
                                                </div>
                                            ) : (
                                                <label className="aspect-[4/5] max-w-[240px] border-2 border-dashed flex flex-col items-center justify-center cursor-pointer hover:border-black transition-all group">
                                                    <Icons.Upload size={24} className="text-gray-300 group-hover:text-black" />
                                                    <span className="text-[10px] uppercase font-bold mt-2 text-gray-400">Upload Underwear Cover</span>
                                                    <input type="file" className="hidden" onChange={async (e) => {
                                                        if (!e.target.files?.[0]) return;
                                                        setIsUploading(true);
                                                        try {
                                                            const url = await uploadToCloudinary(e.target.files[0]);
                                                            handleUpdate({ coverImageUnderwear: url });
                                                            notify('Underwear Cover updated', 'success');
                                                        } catch (err) {
                                                            notify('Upload failed', 'error');
                                                        } finally {
                                                            setIsUploading(false);
                                                        }
                                                    }} />
                                                </label>
                                            )}
                                        </div>
                                    </div>
                                </section>

                                <section className="space-y-10">
                                    <div className="flex justify-between items-center border-b pb-6">
                                        <h3 className="text-[15px] font-bold uppercase tracking-[0.1em]">Influencer Access Codes</h3>
                                        <div className="flex space-x-4">
                                            <label className="text-[14px] uppercase font-bold text-black border-2 border-black px-6 py-2 flex items-center cursor-pointer hover:bg-black hover:text-white transition-colors">
                                                <Icons.Spreadsheet size={18} className="mr-2"/> Bulk Upload (.csv)
                                                <input type="file" accept=".csv" className="hidden" onChange={handleCodeBulkUpload} />
                                            </label>
                                            <button onClick={() => {
                                                const newCode = { code: generateId().substring(0,6), limitMain: 3, limitUnderwear: 2 };
                                                handleUpdateCodes([...accessCodes, newCode]);
                                            }} className="text-[14px] uppercase font-bold text-white bg-black px-6 py-2 flex items-center"><Icons.Plus size={18} className="mr-2"/> Add Code</button>
                                        </div>
                                    </div>
                                    <p className="text-xs text-gray-400 uppercase tracking-wider">* CSV Format: code, limitMain, limitUnderwear (e.g. "GIRLSOUT12,3,2") · 코드는 어드민에게만 보이며 인플루언서 화면으로 전송되지 않습니다.</p>
                                    <div className="grid gap-8">
                                        {accessCodes.map((ac, idx) => {
                                            const isUnique = isCodeGloballyUnique(ac.code, coll.firebaseId, accessCodes);
                                            return (
                                                <div key={idx} className={`flex flex-col xl:flex-row items-stretch xl:items-end gap-6 p-8 border transition-colors ${!isUnique ? 'border-red-500 bg-red-50' : 'bg-gray-50/30'}`}>
                                                    <div className="flex-1 space-y-4 min-w-[200px]">
                                                        <label className="text-[12px] text-grey-light uppercase tracking-normal font-bold">Code</label>
                                                        <div className="relative">
                                                            <EditableCell className={`w-full bg-white border-b-2 py-3 px-3 outline-none text-[16px] uppercase font-bold transition-colors ${!isUnique ? 'border-red-500 focus:border-red-600' : 'focus:border-black'}`} value={ac.code} onSave={val => {
                                                                const codes = [...accessCodes];
                                                                codes[idx] = { ...codes[idx], code: val.trim() };
                                                                handleUpdateCodes(codes);
                                                            }} />
                                                            {!isUnique && <div className="mt-2 text-[10px] text-red-600 font-bold uppercase tracking-tight flex items-center"><Icons.Alert size={14} className="mr-1"/> 이미 사용 중인 코드입니다.</div>}
                                                        </div>
                                                    </div>
                                                    <div className="flex items-center space-x-2 pt-2 xl:pb-3">
                                                        <label className="flex items-center space-x-2 text-[12px] font-bold uppercase cursor-pointer select-none">
                                                            <input 
                                                                type="checkbox" 
                                                                checked={!!ac.isUnlimited} 
                                                                onChange={e => {
                                                                    const codes = [...accessCodes];
                                                                    codes[idx] = { ...codes[idx], isUnlimited: e.target.checked };
                                                                    handleUpdateCodes(codes);
                                                                }} 
                                                                className="accent-black w-4 h-4 rounded" 
                                                            />
                                                            <span className="text-[12px] font-bold uppercase tracking-wide">Unlimited / 무제한</span>
                                                        </label>
                                                    </div>
                                                    <div className={`w-full sm:w-48 space-y-4 ${ac.isUnlimited ? 'opacity-40' : ''}`}>
                                                        <label className="text-[12px] text-grey-light uppercase tracking-normal font-bold">Main Limit</label>
                                                        <EditableCell 
                                                            type="number"
                                                            disabled={!!ac.isUnlimited}
                                                            className="w-full bg-white border-b-2 py-3 px-3 focus:border-black outline-none text-[16px] font-medium" 
                                                            value={ac.isUnlimited ? '' : (ac.limitMain !== undefined ? ac.limitMain : (ac.limit || 3))} 
                                                            placeholder="∞"
                                                            onSave={val => {
                                                                const codes = [...accessCodes];
                                                                codes[idx] = { ...codes[idx], limitMain: parseInt(val) || 0 };
                                                                handleUpdateCodes(codes);
                                                            }} 
                                                        />
                                                    </div>
                                                    <div className={`w-full sm:w-48 space-y-4 ${ac.isUnlimited ? 'opacity-40' : ''}`}>
                                                        <label className="text-[12px] text-grey-light uppercase tracking-normal font-bold">Underwear Limit</label>
                                                        <EditableCell 
                                                            type="number"
                                                            disabled={!!ac.isUnlimited}
                                                            className="w-full bg-white border-b-2 py-3 px-3 focus:border-black outline-none text-[16px] font-medium" 
                                                            value={ac.isUnlimited ? '' : (ac.limitUnderwear !== undefined ? ac.limitUnderwear : 2)} 
                                                            placeholder="∞"
                                                            onSave={val => {
                                                                const codes = [...accessCodes];
                                                                codes[idx] = { ...codes[idx], limitUnderwear: parseInt(val) || 0 };
                                                                handleUpdateCodes(codes);
                                                            }} 
                                                        />
                                                    </div>
                                                    <button onClick={() => handleUpdateCodes(accessCodes.filter((_, i) => i !== idx))} className="p-3 bg-black text-white hover:bg-black/80 transition-colors rounded self-stretch xl:self-end flex items-center justify-center cursor-pointer mt-4 xl:mt-0 xl:h-[50px]"><Icons.Trash size={20}/></button>
                                                </div>
                                            );

                                                        <td className="p-6 text-right">
                                                            <div className="flex justify-end space-x-3">
                                                                <button onClick={() => handleCopyRow(e)} className="p-2 bg-black text-white hover:bg-black/80 transition-transform rounded flex items-center justify-center cursor-pointer" title="Copy Row"><Icons.Copy size={18}/></button>
                                                                <button 
                                                                    onClick={() => {
                                                                        onUpdateEntry(e.id, { isArchived: !e.isArchived });
                                                                        notify(e.isArchived ? '주문이 활성 상태로 복원되었습니다.' : '주문이 보관 처리되었습니다.', 'success');
                                                                    }} 
                                                                    className="p-2 bg-gray-100 hover:bg-gray-200 text-gray-700 transition-transform rounded flex items-center justify-center cursor-pointer" 
                                                                    title={e.isArchived ? 'Restore' : 'Archive'}
                                                                >
                                                                    <Icons.Archive size={18} className={e.isArchived ? 'text-blue-600' : 'text-gray-600'} />
                                                                </button>
                                                                {e.isManual && (
                                                                    <button onClick={() => handleDeleteRow(e.id)} className="p-2 bg-black text-white hover:bg-red-600 transition-transform rounded flex items-center justify-center cursor-pointer" title="Delete Row"><Icons.Trash size={18}/></button>
                                                                )}
                                                            </div>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                )}
                            </div>
                        )}
                        {activeSubView === 'report' && (() => {
                            const activeEntriesOnly = entries.filter(e => !e.isArchived);
                            const totalOrders = activeEntriesOnly.length;
                            const uniqueInfluencers = new Set(activeEntriesOnly.map(e => cleanInstaId(e.instagramId).toLowerCase()).filter(Boolean)).size;
                            const deliveredCount = activeEntriesOnly.filter(e => e.status === '배송완료').length;
                            const preparingCount = activeEntriesOnly.filter(e => e.status === '준비중').length;
                            const holdCount = activeEntriesOnly.filter(e => e.status === '보류').length;

                            // Status distribution (items or unique influencers)
                            const statusList = ['준비중', '배송완료', '보류'];
                            const statusColors = { '준비중': '#f97316', '배송완료': '#16a34a', '보류': '#dc2626' };
                            const distData = statusList.map(st => {
                                const rows = activeEntriesOnly.filter(e => e.status === st);
                                const val = distributionMetric === 'items' 
                                    ? rows.length 
                                    : new Set(rows.map(e => cleanInstaId(e.instagramId).toLowerCase()).filter(Boolean)).size;
                                return { status: st, value: val };
                            });
                            const distTotal = distData.reduce((s, d) => s + d.value, 0);

                            // Donut chart segments
                            const R = 60, C = 2 * Math.PI * R;
                            let accum = 0;
                            const segments = distData.map(d => {
                                const frac = distTotal > 0 ? d.value / distTotal : 0;
                                const seg = { ...d, dash: frac * C, offset: accum * C };
                                accum += frac;
                                return seg;
                            });

                            // Product ranking
                            const rankFor = (sub) => {
                                const counts = {};
                                activeEntriesOnly.filter(e => (e.subCollection || 'main') === sub).forEach(e => {
                                    const key = e.productName || 'Unknown';
                                    counts[key] = (counts[key] || 0) + 1;
                                });
                                return Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 10);
                            };
                            const rankMain = rankFor('main');
                            const rankUnderwear = rankFor('underwear');
                            const maxMain = rankMain.length ? rankMain[0][1] : 1;
                            const maxUnderwear = rankUnderwear.length ? rankUnderwear[0][1] : 1;

                            const productsList = coll.products || [];
                            const reportProduct = productsList.find(p => p.id === selectedReportProductId);
                            const reportOrders = reportProduct 
                                ? activeEntriesOnly.filter(e => String(e.productName || '').trim().toLowerCase() === String(reportProduct.name || '').trim().toLowerCase())
                                : [];
                            const reportBySize = {};
                            reportOrders.forEach(e => {
                                const sz = e.size || 'OS';
                                if (!reportBySize[sz]) reportBySize[sz] = [];
                                reportBySize[sz].push(e);
                            });

                            return (
                                <div className="max-w-7xl mx-auto space-y-16 animate-fade-in pb-24">
                                    {/* Metric Cards */}
                                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-6">
                                        {[
                                            { label: 'Total Orders', value: totalOrders, sub: 'active items' },
                                            { label: 'Influencers', value: uniqueInfluencers, sub: 'unique accounts' },
                                            { label: 'Delivered', value: deliveredCount, sub: `${totalOrders > 0 ? Math.round(deliveredCount/totalOrders*100) : 0}% complete` },
                                            { label: 'Preparing / Hold', value: `${preparingCount} / ${holdCount}`, sub: 'in pipeline' }
                                        ].map((m, i) => (
                                            <div key={i} className="bg-nuuanu-blue-soft border border-nuuanu-blue-light p-8 rounded-3xl">
                                                <p className="text-[11px] uppercase font-bold text-nuuanu-blue tracking-wide">{m.label}</p>
                                                <p className="text-4xl font-light mt-4">{m.value}</p>
                                                <p className="text-[10px] uppercase text-grey-light mt-2">{m.sub}</p>
                                            </div>
                                        ))}
                                    </div>

                                    {/* Status Distribution + Ranking */}
                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-12">
                                        <section className="border p-10 rounded-3xl space-y-8">
                                            <div className="flex justify-between items-center">
                                                <h3 className="text-[14px] font-bold uppercase tracking-[0.1em]">Order Status Distribution</h3>
                                                <div className="flex bg-gray-100 rounded-full p-1 text-[10px]">
                                                    <button onClick={() => setDistributionMetric('items')} className={`px-3 py-1 uppercase font-bold rounded-full ${distributionMetric === 'items' ? 'bg-white shadow-sm' : 'text-gray-400'}`}>Items</button>
                                                    <button onClick={() => setDistributionMetric('influencers')} className={`px-3 py-1 uppercase font-bold rounded-full ${distributionMetric === 'influencers' ? 'bg-white shadow-sm' : 'text-gray-400'}`}>Influencers</button>
                                                </div>
                                            </div>
                                            <div className="flex items-center justify-center gap-12 flex-wrap">
                                                <svg width="160" height="160" viewBox="0 0 160 160">
                                                    <circle cx="80" cy="80" r={R} fill="none" stroke="#f3f4f6" strokeWidth="18" />
                                                    {segments.map(seg => seg.value > 0 && (
                                                        <circle 
                                                            key={seg.status}
                                                            cx="80" cy="80" r={R} fill="none" 
                                                            stroke={statusColors[seg.status]} strokeWidth="18"
                                                            strokeDasharray={`${seg.dash} ${C - seg.dash}`}
                                                            strokeDashoffset={-seg.offset}
                                                            transform="rotate(-90 80 80)"
                                                        />
                                                    ))}
                                                    <text x="80" y="76" textAnchor="middle" className="font-light" style={{fontSize: '28px'}}>{distTotal}</text>
                                                    <text x="80" y="96" textAnchor="middle" style={{fontSize: '9px', textTransform: 'uppercase', fill: '#9ca3af'}}>{distributionMetric}</text>
                                                </svg>
                                                <div className="space-y-3">
                                                    {distData.map(d => (
                                                        <div key={d.status} className="flex items-center space-x-3 text-[12px]">
                                                            <span className="w-3 h-3 rounded-full inline-block" style={{backgroundColor: statusColors[d.status]}}></span>
                                                            <span className="font-bold uppercase w-16">{d.status}</span>
                                                            <span className="text-grey-medium">{d.value} ({distTotal > 0 ? Math.round(d.value/distTotal*100) : 0}%)</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        </section>

                                        <section className="border p-10 rounded-3xl space-y-8">
                                            <h3 className="text-[14px] font-bold uppercase tracking-[0.1em]">Product Order Ranking (Top 10)</h3>
                                            <div className="space-y-6">
                                                <div className="space-y-2">
                                                    <p className="text-[10px] uppercase font-bold text-blue-600">{subCollectionNameMain}</p>
                                                    {rankMain.length === 0 && <p className="text-[11px] text-gray-300 uppercase">No orders yet</p>}
                                                    {rankMain.map(([name, count], i) => (
                                                        <div key={name} className="flex items-center space-x-3 text-[12px]">
                                                            <span className="w-5 text-right font-bold text-gray-400">{i+1}</span>
                                                            <span className="w-40 truncate font-medium" title={name}>{name}</span>
                                                            <div className="flex-1 bg-gray-100 h-4 rounded-full overflow-hidden">
                                                                <div className="h-full bg-blue-500" style={{width: `${(count/maxMain)*100}%`}}></div>
                                                            </div>
                                                            <span className="w-8 text-right font-bold">{count}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                                <div className="space-y-2 pt-4 border-t">
                                                    <p className="text-[10px] uppercase font-bold text-purple-600">{subCollectionNameUnderwear}</p>
                                                    {rankUnderwear.length === 0 && <p className="text-[11px] text-gray-300 uppercase">No orders yet</p>}
                                                    {rankUnderwear.map(([name, count], i) => (
                                                        <div key={name} className="flex items-center space-x-3 text-[12px]">
                                                            <span className="w-5 text-right font-bold text-gray-400">{i+1}</span>
                                                            <span className="w-40 truncate font-medium" title={name}>{name}</span>
                                                            <div className="flex-1 bg-gray-100 h-4 rounded-full overflow-hidden">
                                                                <div className="h-full bg-purple-500" style={{width: `${(count/maxUnderwear)*100}%`}}></div>
                                                            </div>
                                                            <span className="w-8 text-right font-bold">{count}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        </section>
                                    </div>

                                    {/* Influencer Order Tracker */}
                                    <section className="border p-10 rounded-3xl space-y-8">
                                        <div className="flex flex-col md:flex-row md:justify-between md:items-center gap-4">
                                            <h3 className="text-[14px] font-bold uppercase tracking-[0.1em]">Influencer Order Tracker</h3>
                                            <select 
                                                value={selectedReportProductId} 
                                                onChange={e => setSelectedReportProductId(e.target.value)}
                                                className="border-2 px-6 py-2.5 text-[12px] font-bold uppercase bg-white outline-none focus:border-black"
                                            >
                                                <option value="">— Select Product —</option>
                                                {productsList.map(p => (
                                                    <option key={p.id} value={p.id}>{p.name}</option>
                                                ))}
                                            </select>
                                        </div>
                                        {!reportProduct ? (
                                            <p className="text-[11px] text-gray-300 uppercase text-center py-8">제품을 선택하면 사이즈별 주문자 목록이 표시됩니다.</p>
                                        ) : (
                                            <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-6">
                                                {(reportProduct.options || []).map(szOpt => {
                                                    const sz = szOpt.trim();
                                                    const rows = reportBySize[sz] || [];
                                                    return (
                                                        <div key={sz} className="bg-gray-50/50 border p-6 rounded-2xl space-y-4">
                                                            <div className="flex justify-between items-center border-b pb-3">
                                                                <span className="font-bold uppercase text-[13px]">Size {sz}</span>
                                                                <span className="text-[11px] font-bold bg-black text-white px-3 py-1 rounded-full">{rows.length}</span>
                                                            </div>
                                                            {rows.length === 0 ? (
                                                                <p className="text-[10px] text-gray-300 uppercase">No orders</p>
                                                            ) : (
                                                                <ul className="space-y-2">
                                                                    {rows.map(e => (
                                                                        <li key={e.id} className="flex items-center justify-between text-[12px]">
                                                                            <a href={`https://www.instagram.com/${cleanInstaId(e.instagramId)}`} target="_blank" rel="noopener noreferrer" className="font-bold hover:underline truncate max-w-[120px]">@{cleanInstaId(e.instagramId)}</a>
                                                                            <select 
                                                                                className={`text-[10px] px-2 py-1 border font-bold uppercase bg-white rounded-full ${getStatusColorClass(e.status)}`}
                                                                                value={e.status}
                                                                                onChange={ev => {
                                                                                    const nextStatus = ev.target.value;
                                                                                    const patch = nextStatus === '배송완료' 
                                                                                        ? { status: nextStatus, deliveredDate: todayStr() } 
                                                                                        : { status: nextStatus };
                                                                                    onUpdateEntry(e.id, patch);
                                                                                }}
                                                                            >
                                                                                <option value="준비중">준비중</option>
                                                                                <option value="배송완료">배송완료</option>
                                                                                <option value="보류">보류</option>
                                                                            </select>
                                                                        </li>
                                                                    ))}
                                                                </ul>
                                                            )}
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        )}
                                    </section>

                                    {/* Inventory & Order Board */}
                                    <section className="border p-10 rounded-3xl space-y-8">
                                        <h3 className="text-[14px] font-bold uppercase tracking-[0.1em]">Inventory & Order Board</h3>
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left text-[13px] min-w-[800px]">
                                                <thead className="bg-gray-50 uppercase text-[10px] tracking-wide text-grey-medium border-b-2">
                                                    <tr>
                                                        <th className="p-4">Product</th>
                                                        <th className="p-4">Size</th>
                                                        <th className="p-4 text-center">Init</th>
                                                        <th className="p-4 text-center">Current</th>
                                                        <th className="p-4 text-center">Ordered</th>
                                                        <th className="p-4 text-center">Visibility</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-gray-100">
                                                    {productsList.map(p => {
                                                        const opts = (p.options || []).map(o => o.trim()).filter(Boolean);
                                                        return opts.map((sz, si) => {
                                                            const init = (p.initialInventory && p.initialInventory[sz] !== undefined) ? p.initialInventory[sz] : 10;
                                                            const curr = (p.inventory && p.inventory[sz] !== undefined) ? p.inventory[sz] : 10;
                                                            const ordered = activeEntriesOnly.filter(e => 
                                                                String(e.productName || '').trim().toLowerCase() === String(p.name || '').trim().toLowerCase() 
                                                                && String(e.size || '').trim() === sz
                                                            ).length;
                                                            const hidden = p.isHidden && p.isHidden[sz] === true;
                                                            return (
                                                                <tr key={`${p.id}-${sz}`} className={curr <= 0 ? 'bg-red-50/50' : ''}>
                                                                    {si === 0 && (
                                                                        <td className="p-4 font-bold align-top" rowSpan={opts.length}>
                                                                            {p.name}
                                                                            <span className={`block text-[9px] mt-1 uppercase font-bold ${(p.subCollection || 'main') === 'underwear' ? 'text-purple-500' : 'text-blue-500'}`}>
                                                                                {(p.subCollection || 'main') === 'underwear' ? subCollectionNameUnderwear : subCollectionNameMain}
                                                                            </span>
                                                                        </td>
                                                                    )}
                                                                    <td className="p-4 font-bold uppercase">{sz}</td>
                                                                    <td className="p-4 text-center text-grey-medium">{init}</td>
                                                                    <td className={`p-4 text-center font-bold ${curr <= 0 ? 'text-red-600' : ''}`}>{curr}</td>
                                                                    <td className="p-4 text-center">{ordered}</td>
                                                                    <td className="p-4 text-center">
                                                                        <button 
                                                                            onClick={() => {
                                                                                const nextHidden = { ...(p.isHidden || {}) };
                                                                                nextHidden[sz] = !hidden;
                                                                                handleUpdate({
                                                                                    products: coll.products.map(x => x.id === p.id ? { ...x, isHidden: nextHidden } : x)
                                                                                });
                                                                            }}
                                                                            className={`text-[10px] font-bold uppercase px-4 py-1.5 border transition-colors ${hidden ? 'bg-gray-100 text-gray-400 border-gray-200' : 'bg-green-50 text-green-700 border-green-200'}`}
                                                                        >
                                                                            {hidden ? 'Hidden' : 'Visible'}
                                                                        </button>
                                                                    </td>
                                                                </tr>
                                                            );
                                                        });
                                                    })}
                                                </tbody>
                                            </table>
                                        </div>
                                    </section>
                                </div>
                            );
                        })()}
                    </main>
                    <SyncMonitor />
                    <Toast error={error} success={success} />
                </div>
            );
        };

        const InfluencerPage = ({ collection: coll, cart, setCart, onLogout, notify, onSubmission, error, success, influencerInfo }) => {
            const [view, setView] = useState('home'); // home | products | detail | cart | success
            const [activeSub, setActiveSub] = useState('main');
            const [selectedProduct, setSelectedProduct] = useState(null);
            const [selectedSize, setSelectedSize] = useState('');
            const [lookIdx, setLookIdx] = useState(0);
            const [detailImgIdx, setDetailImgIdx] = useState(0);
            const [submitting, setSubmitting] = useState(false);
            const [formData, setFormData] = useState({ instagramId: (influencerInfo && influencerInfo.instagramId) || '', name: '', phone: '', address: '', message: '', agreed: false });

            useEffect(() => {
                if (influencerInfo && influencerInfo.instagramId) {
                    setFormData(f => ({ ...f, instagramId: influencerInfo.instagramId }));
                }
            }, [influencerInfo && influencerInfo.instagramId]);
            const touchStartX = useRef(null);
            const scrollRef = useRef(null);

            const isUnlimited = !!(influencerInfo && influencerInfo.isUnlimited);
            const limitMain = influencerInfo && influencerInfo.limitMain !== undefined ? Number(influencerInfo.limitMain) : 3;
            const limitUnderwear = influencerInfo && influencerInfo.limitUnderwear !== undefined ? Number(influencerInfo.limitUnderwear) : 2;
            const usedMain = influencerInfo && influencerInfo.usedMain !== undefined ? Number(influencerInfo.usedMain) : 0;
            const usedUnderwear = influencerInfo && influencerInfo.usedUnderwear !== undefined ? Number(influencerInfo.usedUnderwear) : 0;

            const subCollectionNameMain = coll.subCollectionNameMain || 'Nuuanu Main Collection';
            const subCollectionNameUnderwear = coll.subCollectionNameUnderwear || 'Nuuanu Underwear Collection';

            const allProducts = (coll.products || []).filter(p => p.isAvailable !== false);
            const mainProducts = allProducts.filter(p => (p.subCollection || 'main') === 'main');
            const underwearProducts = allProducts.filter(p => p.subCollection === 'underwear');
            const isSingleCollectionOnly = underwearProducts.length === 0;

            const selectedMainCount = cart.filter(c => c.subCollection !== 'underwear').length;
            const selectedUnderwearCount = cart.filter(c => c.subCollection === 'underwear').length;
            const totalMain = usedMain + selectedMainCount;
            const totalUnderwear = usedUnderwear + selectedUnderwearCount;

            const lookImages = coll.lookbookImages || [];

            useEffect(() => {
                window.scrollTo(0, 0);
            }, [view, selectedProduct]);

            const openSub = (sub) => {
                setActiveSub(sub);
                setView('products');
            };

            const openProduct = (p) => {
                setSelectedProduct(p);
                setSelectedSize('');
                setDetailImgIdx(0);
                setView('detail');
            };

            const availableSizes = (p) => {
                return (p.options || []).map(o => o.trim()).filter(Boolean).filter(sz => {
                    const stock = (p.inventory && p.inventory[sz] !== undefined) ? Number(p.inventory[sz]) : 10;
                    const hidden = p.isHidden && p.isHidden[sz] === true;
                    return stock > 0 && !hidden;
                });
            };

            const addToCart = () => {
                if (!selectedProduct || !selectedSize) {
                    alert('사이즈를 선택해주세요.');
                    return;
                }
                const sub = (selectedProduct.subCollection || 'main') === 'underwear' ? 'underwear' : 'main';
                if (!isUnlimited) {
                    if (sub === 'main' && totalMain >= limitMain) {
                        alert(`${subCollectionNameMain} 신청 가능 수량을 모두 사용하셨습니다. (기존 신청 ${usedMain}개 포함, 최대 ${limitMain}개)`);
                        return;
                    }
                    if (sub === 'underwear' && totalUnderwear >= limitUnderwear) {
                        alert(`${subCollectionNameUnderwear} 신청 가능 수량을 모두 사용하셨습니다. (기존 신청 ${usedUnderwear}개 포함, 최대 ${limitUnderwear}개)`);
                        return;
                    }
                }
                const inCartSame = cart.filter(c => c.productName === selectedProduct.name && c.size === selectedSize).length;
                const stock = (selectedProduct.inventory && selectedProduct.inventory[selectedSize] !== undefined) ? Number(selectedProduct.inventory[selectedSize]) : 10;
                if (inCartSame + 1 > stock) {
                    alert('해당 사이즈의 재고가 부족합니다.');
                    return;
                }
                setCart([...cart, { 
                    cartId: generateId(), 
                    productName: selectedProduct.name, 
                    size: selectedSize, 
                    image: (selectedProduct.images || [])[0] || '', 
                    subCollection: sub 
                }]);
                notify('선택 목록에 담았습니다.', 'success');
                setView('products');
            };

            const removeFromCart = (cartId) => {
                setCart(cart.filter(c => c.cartId !== cartId));
            };

            const handleSubmit = async () => {
                if (cart.length === 0) { alert('선택한 아이템이 없습니다.'); return; }
                if (!formData.instagramId.trim() || !formData.name.trim() || !formData.phone.trim() || !formData.address.trim()) {
                    alert('필수 정보를 모두 입력해주세요.');
                    return;
                }
                if (!formData.agreed) {
                    alert('안내 사항에 동의해주세요.');
                    return;
                }
                setSubmitting(true);
                const ok = await onSubmission({
                    items: cart.map(it => ({ productName: it.productName, size: it.size })),
                    formData: { ...formData, instagramId: cleanInstaId(formData.instagramId) }
                });
                setSubmitting(false);
                if (ok) {
                    setCart([]);
                    setView('success');
                }
            };

            const Header = () => (
                <header className="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-gray-100 py-6 px-6 md:px-12 flex justify-between items-center">
                    <button onClick={() => setView('home')} className="text-xl font-light tracking-[0.1em] uppercase">nuuanu</button>
                    <div className="flex items-center space-x-6">
                        <button onClick={() => setView('cart')} className="relative flex items-center">
                            <Icons.ShoppingBag size={20} />
                            {cart.length > 0 && <span className="absolute -top-2 -right-2 bg-black text-white text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center">{cart.length}</span>}
                        </button>
                        <button onClick={onLogout} className="text-grey-medium hover:text-black"><Icons.LogOut size={18} /></button>
                    </div>
                </header>
            );

            if (view === 'success') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 bg-white animate-fade-in">
                        <div className="max-w-md w-full text-center space-y-10">
                            <Icons.Success size={56} className="mx-auto text-green-500" />
                            <h2 className="text-2xl font-light uppercase tracking-[0.1em]">Thank You</h2>
                            <p className="text-[13px] text-grey-medium leading-relaxed">
                                신청이 완료되었습니다.<br/>
                                제품은 순차적으로 배송될 예정이에요.<br/>
                                누아누와 함께해주셔서 감사합니다. 🌺
                            </p>
                            <button onClick={() => setView('home')} className="border-2 border-black px-12 py-4 text-[12px] uppercase font-bold hover:bg-black hover:text-white transition-all">Back to Showroom</button>
                        </div>

                                            <span className="text-[12px] text-grey-medium leading-relaxed">
                                                재고 상황 등에 따라 일부 내용이 달라질 수 있으며, 올려주신 콘텐츠는 브랜드 소개나 홍보에 활용될 수 있음에 동의합니다.

                                        <button

                                            className={`w-full py-5 text-[13px] uppercase font-bold transition-colors ${cart.length === 0 || !formData.agreed || submitting ? 'bg-gray-200 text-gray-400 cursor-not-allowed' : 'bg-black text-white hover:bg-black/80'}`}

            // Home: lookbook + gateway
            return (
                <div className="min-h-screen bg-white animate-fade-in">
                    <Header />
                    <main className="max-w-6xl mx-auto p-6 md:p-12 space-y-20">
                        {lookImages.length > 0 && (
                            <section 
                                className="relative max-w-lg mx-auto"
                                onTouchStart={e => { touchStartX.current = e.touches[0].clientX; }}
                                onTouchEnd={e => {
                                    if (touchStartX.current === null || lookImages.length < 2) return;
                                    const diff = e.changedTouches[0].clientX - touchStartX.current;
                                    if (diff < -40) setLookIdx(i => (i + 1) % lookImages.length);
                                    if (diff > 40) setLookIdx(i => (i - 1 + lookImages.length) % lookImages.length);
                                    touchStartX.current = null;

                            >
                                <div className="aspect-[2/3] overflow-hidden bg-gray-50">

                                </div>
                                {lookImages.length > 1 && (
