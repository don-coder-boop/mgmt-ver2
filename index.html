            try {
                const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
                    method: 'POST',
                    body: formData,
                });
                if (!response.ok) throw new Error('Upload failed');
                const data = await response.json();
                return data.secure_url;
            } catch (error) {
                console.error('Cloudinary upload error:', error);
                throw error;

        const parseCSV = (text) => {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const nextChar = text[i + 1];
                if (inQuotes) {
                    if (char === '"' && nextChar === '"') { currentField += '"'; i++; }
                    else if (char === '"') inQuotes = false;
                    else currentField += char;
                } else {
                    if (char === '"') inQuotes = true;
                    else if (char === ',') { currentRow.push(currentField); currentField = ''; }
                    else if (char === '\n' || char === '\r') {
                        if (currentField || currentRow.length > 0) { currentRow.push(currentField); rows.push(currentRow); currentRow = []; currentField = ''; }
                        if (char === '\r' && nextChar === '\n') i++;
                    } else currentField += char;
                }
            }
            if (currentField || currentRow.length > 0) { currentRow.push(currentField); rows.push(currentRow); }
            return rows;
        };

        const downloadCSV = (filename, data) => {
            if (data.length === 0) return;
            const headers = ["instagram ID", "이름", "전화번호", "받는분기타연락처", "받는분우편번호", "주소", "제품명", "사이즈", "수량", "배송메세지1", "소속컬렉션"];
            const csvRows = [headers.join(',')];
            data.forEach(item => {
                const escape = (val) => `"${String(val || "").replace(/"/g, '""')}"`;
                csvRows.push([
                    escape(item.instagramId), escape(item.name), escape(item.phone),
                    escape(""), escape(""), escape(item.address),
                    escape(item.productName), escape(item.size), escape(1), escape(item.message),
                    escape(item.subCollection || "main")
                ].join(','));
            });
            const blob = new Blob(["\uFEFF" + csvRows.join('\n')], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;

            const handleUpdate = (u, skipNotify = false) => {

            const isCodeGloballyUnique = (code, currentCollectionId, codesInThisCollection = []) => {

                    const codes = c.accessCodesV2 || [];
                    return codes.some(ac => ac.code.toLowerCase().trim() === lowerCode);
                });
                if (existsInOtherCollection) return false;
                const localMatches = codesInThisCollection.filter(ac => ac.code.toLowerCase().trim() === lowerCode);
                if (localMatches.length > 1) return false;
                return true;
            };

            const handleCodeBulkUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    const content = evt.target.result;
                    const rows = parseCSV(content);
                    if (rows.length < 2) return;
                    const newCodes = [];
                    const currentCodes = collection.accessCodesV2 || [];
                    for (let i = 1; i < rows.length; i++) {
                        const cols = rows[i];
                        if (!cols || cols.length < 1) continue;
                        const code = cols[0]?.trim();
                        const limitMain = parseInt(cols[1]) || 3;
                        const limitUnderwear = parseInt(cols[2]) || 2;
                        if (code) {
                            const combinedTemp = [...currentCodes, ...newCodes];
                            if (isCodeGloballyUnique(code, collection.id, [...combinedTemp, { code }])) {
                                newCodes.push({ code: code, limitMain: limitMain, limitUnderwear: limitUnderwear });
                            }
                        }
                    }
                    if (newCodes.length > 0) {
                        handleUpdate({ accessCodesV2: [...currentCodes, ...newCodes] });
                        notify(`${newCodes.length} codes imported`, 'success');
                    } else {
                        notify('No valid or unique codes found', 'error');
                    }
                };
                reader.readAsText(file);
                e.target.value = null;
            };

            const handleCSVUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    const content = evt.target.result;
                    const rows = parseCSV(content);
                    if (rows.length < 2) return;
                    const newProducts = [];
                    for (let i = 1; i < rows.length; i++) {
                        const cols = rows[i];
                        if (!cols || cols.length < 4) continue;
                        const [name, price, optionStr, summary, subCol] = cols;
                        let options = ['OS'];
                        const match = (optionStr || '').match(/size\{([^}]+)\}/i);
                        if (match) options = match[1].split('|');
                        
                        const subVal = (subCol || 'main').toLowerCase().trim() === 'underwear' ? 'underwear' : 'main';

                        newProducts.push({ 
                            id: generateId(), 
                            name: name || 'New Item', 
                            price: price || '0', 
                            options: options, 
                            description: summary || '', 
                            images: [],
                            subCollection: subVal
                        });
                    }
                    if (newProducts.length > 0) {
                        handleUpdate({ products: [...collection.products, ...newProducts] });
                        notify(`${newProducts.length} items added`, 'success');
                    }
                };
                reader.readAsText(file);
                e.target.value = null; 
            };

            const shippingEntries = collection.shippingEntries || [];

            const sortedShipping = useMemo(() => {
                let data = [...shippingEntries];
                if (showArchived) {
                    data = data.filter(e => !!e.isArchived);
                } else {
                    data = data.filter(e => !e.isArchived);
                }

                // Apply status filtering
                if (shippingStatusFilter !== 'All') {
                    data = data.filter(e => e.status === shippingStatusFilter);
                }

                // Apply text search filtering
                if (shippingSearchQuery.trim()) {
                    const query = shippingSearchQuery.toLowerCase().trim();
                    data = data.filter(e => 
                        String(e.instagramId || '').toLowerCase().includes(query) ||
                        String(e.name || '').toLowerCase().includes(query) ||
                        String(e.productName || '').toLowerCase().includes(query) ||
                        String(e.phone || '').toLowerCase().includes(query) ||
                        String(e.adminMemo || '').toLowerCase().includes(query) ||
                        String(e.address || '').toLowerCase().includes(query)
                    );
                }

                if (!sortConfig.key) return data;
                return data.sort((a, b) => {
                    const valA = String(a[sortConfig.key] || '').toLowerCase();
                    const valB = String(b[sortConfig.key] || '').toLowerCase();
                    if (valA < valB) return sortConfig.direction === 'asc' ? -1 : 1;
                    if (valA > valB) return sortConfig.direction === 'asc' ? 1 : -1;
                    return 0;
                });
            }, [shippingEntries, sortConfig, showArchived, shippingStatusFilter, shippingSearchQuery]);

            const handleBulkStatusChange = (newStatus) => {
                if (selectedRows.size === 0) return;
                const today = new Date();
                const yyyy = today.getFullYear();
                const mm = String(today.getMonth() + 1).padStart(2, '0');
                const dd = String(today.getDate()).padStart(2, '0');
                const formattedDate = `${yyyy}-${mm}-${dd}`;

                const next = shippingEntries.map(e => {
                    if (selectedRows.has(e.id)) {
                        return { 
                            ...e, 
                            status: newStatus,
                            deliveredDate: newStatus === '배송완료' ? formattedDate : (e.deliveredDate || '')
                        };
                    }
                    return e;
                });
                handleUpdate({ shippingEntries: next });
                setSelectedRows(new Set());
            };

            const handleBulkArchive = (archiveBool) => {
                if (selectedRows.size === 0) return;
                const next = shippingEntries.map(e => selectedRows.has(e.id) ? { ...e, isArchived: archiveBool } : e);
                handleUpdate({ shippingEntries: next });
                setSelectedRows(new Set());
                notify(archiveBool ? '주문이 보관 처리되었습니다.' : '주문이 복원 처리되었습니다.', 'success');
            };

            const toggleRow = (id) => {
                const next = new Set(selectedRows);
                if (next.has(id)) next.delete(id); else next.add(id);
                setSelectedRows(next);
            };

            const toggleAll = () => {
                if (selectedRows.size === sortedShipping.length && sortedShipping.length > 0) setSelectedRows(new Set());
                else setSelectedRows(new Set(sortedShipping.map(e => e.id)));
            };

            const handleSort = (key) => {
                setSortConfig(prev => ({ key, direction: prev.key === key && prev.direction === 'asc' ? 'desc' : 'asc' }));
            };

            const renderSortIcon = (key) => {
                if (sortConfig.key !== key) return <Icons.ChevronDown size={14} className="opacity-30 ml-1" />;
                return sortConfig.direction === 'asc' ? <Icons.ChevronUp size={14} className="ml-1" /> : <Icons.ChevronDown size={14} className="ml-1" />;
            };

            const truncateText = (text, len = 10) => {
                if (!text) return '';
                if (text.length <= len) return text;
                return text.substring(0, len) + '...';
            };

            const handleExport = () => {
                const dataToExport = selectedRows.size > 0 
                    ? shippingEntries.filter(e => selectedRows.has(e.id))
                    : shippingEntries;
                downloadCSV(`${collection.name}_shipments.csv`, dataToExport);
            };

            const handleCopyRow = (e) => {
                const newRow = { 
                    ...e, 
                    id: generateId(), 
                    submitDate: new Date().toISOString().split('T')[0], 
                    status: '준비중',
                    isManual: true 
                };
                handleUpdate({ shippingEntries: [newRow, ...shippingEntries] });
            };

            const handleDeleteRow = (id) => {
                if(confirm('Delete this record?')) {
                    handleUpdate({ shippingEntries: shippingEntries.filter(x => x.id !== id) });
                }
            };

            const handleDeleteCollection = () => {
                if (window.confirm("정말로 이 컬렉션을 삭제하시겠습니까? 삭제된 데이터는 복구할 수 없습니다.")) {
                    const inputCode = window.prompt("보안을 위해 어드민 코드를 입력해 주세요.");
                    if (inputCode === adminAccessCode) {
                        onDelete();
                    } else if (inputCode !== null) {
                        notify('어드민 코드가 틀렸습니다.', 'error');
                    }
                }
            };

            const handleLookbookUpload = async (e) => {
                if (!e.target.files) return;
                setIsUploading(true);
                try {
                    const uploads = Array.from(e.target.files).map(f => uploadToCloudinary(f));
                    const urls = await Promise.all(uploads);
                    handleUpdate({ lookbookImages: [...(collection.lookbookImages || []), ...urls] });
                    notify(`${urls.length} images uploaded`, 'success');
                } catch (err) {
                    notify('Upload failed.', 'error');
                } finally {
                    setIsUploading(false);
                }
            };

            const handleProductImageUpload = async (productId, e) => {
                if (!e.target.files) return;
                setIsUploading(true);
                try {
                    const uploads = Array.from(e.target.files).map(f => uploadToCloudinary(f));
                    const urls = await Promise.all(uploads);
                    const updatedProducts = (collection.products || []).map(p => 
                        p.id === productId ? { ...p, images: [...(p.images || []), ...urls] } : p
                    );
                    handleUpdate({ products: updatedProducts });
                    notify(`${urls.length} images uploaded`, 'success');
                } catch (err) {
                    notify('Upload failed.', 'error');
                } finally {
                    setIsUploading(false);
                }
            };

            const accessCodes = collection.accessCodesV2 || [];

            const productCounts = useMemo(() => {
                const map = shippingEntries.reduce((acc, curr) => {
                    if (!curr.productName) return acc;
                    const n = curr.productName.toUpperCase().trim();
                    acc[n] = (acc[n] || 0) + 1;
                    return acc;
                }, {});
                return Object.entries(map).sort((a, b) => b[1] - a[1]);
            }, [shippingEntries]);

            const maxCount = useMemo(() => {
                return productCounts.length > 0 ? productCounts[0][1] : 0;
            }, [productCounts]);

            return (
                <div className="min-h-screen bg-white flex flex-col animate-fade-in">
                    <header className="border-b border-gray-100 py-8 px-12 flex justify-between items-center bg-white sticky top-0 z-40 backdrop-blur-md bg-white/90">
                        <div className="flex items-center space-x-12">
                            <button onClick={onBack} className="text-[15px] uppercase tracking-[0.075em] flex items-center hover:text-gray-400 font-bold group">
                                <Icons.ChevronLeft size={22} className="mr-2 group-hover:-translate-x-1 transition-transform" /> Back
                            </button>
                            <h2 className="text-[18px] font-bold tracking-[0.1em] uppercase">{collection.name}</h2>
                        </div>
                        <nav className="flex space-x-16">
                            {[
                                {id:'settings', label:'Settings', icon:Icons.Settings}, 
                                {id:'products', label:'Products', icon:Icons.Package}, 
                                {id:'shipping', label:'Shipping', icon:Icons.Truck}, 
                                {id:'report', label:'Dashboard', icon:Icons.Chart}
                            ].map(tab => (
                                <button key={tab.id} onClick={() => setSubView(tab.id)} className={`flex items-center space-x-3 text-[15px] uppercase tracking-[0.075em] py-2 ${activeSubView === tab.id ? 'text-black font-bold border-b-2 border-black' : 'text-grey-medium hover:text-black'}`}>
                                    <tab.icon size={20} /> <span className="hidden md:inline">{tab.label}</span>
                                </button>
                            ))}
                        </nav>
                    </header>
                    <main className="flex-1 p-12 overflow-auto">
                        {isUploading && (
                            <div className="fixed top-24 left-1/2 -translate-x-1/2 z-50 bg-black text-white px-8 py-4 flex items-center space-x-4 shadow-2xl">
                                <Icons.Loading className="animate-spin" />
                                <span className="text-[12px] font-bold uppercase tracking-normal">Syncing...</span>
                            </div>
                        )}
                        {activeSubView === 'settings' && (
                            <div className="max-w-5xl mx-auto space-y-20 py-10">
                                <section className="space-y-10">
                                    <h3 className="text-[15px] font-bold uppercase tracking-[0.1em] border-b pb-6">Global Config</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-12">
                                        <div className="space-y-4">
                                            <label className="text-[14px] text-grey-medium uppercase font-bold tracking-normal">Admin Code</label>
                                            <input type="text" className="w-full border-b-2 py-3 focus:border-black outline-none text-[16px]" value={adminAccessCode} onChange={e => updateAdminCode(e.target.value)} />
                                        </div>
                                    </div>
                                </section>

                                <section className="space-y-10">
                                    <h3 className="text-[15px] font-bold uppercase tracking-[0.1em] border-b pb-6 text-black">Sub-Collection Names Setting</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-12">
                                        <div className="space-y-4">
                                            <label className="text-[12px] text-grey-medium uppercase font-bold tracking-normal">Main Category Label (or Brand Category)</label>
                                            <input type="text" className="w-full border-b-2 py-3 focus:border-black outline-none text-[16px] font-bold" value={subCollectionNameMain} onChange={e => handleUpdate({ subCollectionNameMain: e.target.value }, true)} />
                                        </div>
                                        <div className="space-y-4">
                                            <label className="text-[12px] text-grey-medium uppercase font-bold tracking-normal">Underwear Category Label (or Alternative)</label>
                                            <input type="text" className="w-full border-b-2 py-3 focus:border-black outline-none text-[16px] font-bold" value={subCollectionNameUnderwear} onChange={e => handleUpdate({ subCollectionNameUnderwear: e.target.value }, true)} />
                                        </div>
                                    </div>
                                </section>

                                <section className="space-y-10">
                                    <h3 className="text-[15px] font-bold uppercase tracking-[0.1em] border-b pb-6 text-black">Sub-Collection Cover Images</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-12">
                                        <div className="space-y-4">
                                            <label className="text-[12px] text-grey-medium uppercase font-bold tracking-normal">{subCollectionNameMain} Cover Image (4:5 ratio requested)</label>
                                            {collection.coverImageMain ? (
                                                <div className="relative aspect-[4/5] max-w-[240px] border">
                                                    <img src={collection.coverImageMain} className="w-full h-full object-cover" />
                                                    <button onClick={() => handleUpdate({ coverImageMain: '' })} className="absolute top-2 right-2 bg-white/80 p-2 shadow rounded-full cursor-pointer hover:bg-white"><Icons.X size={16}/></button>
                                                </div>
                                            ) : (
                                                <label className="aspect-[4/5] max-w-[240px] border-2 border-dashed flex flex-col items-center justify-center cursor-pointer hover:border-black transition-all group">
                                                    <Icons.Upload size={24} className="text-gray-300 group-hover:text-black" />
                                                    <span className="text-[10px] uppercase font-bold mt-2 text-gray-400">Upload Main Cover</span>
                                                    <input type="file" className="hidden" onChange={async (e) => {
                                                        if (!e.target.files?.[0]) return;
                                                        setIsUploading(true);
                                                        try {
                                                            const url = await uploadToCloudinary(e.target.files[0]);
                                                            handleUpdate({ coverImageMain: url });
                                                            notify('Main Cover updated', 'success');
                                                        } catch (err) {
                                                            notify('Upload failed', 'error');
                                                        } finally {
                                                            setIsUploading(false);
                                                        }
                                                    }} />
                                                </label>
                                            )}
                                        </div>
                                        <div className="space-y-4">
                                            <label className="text-[12px] text-grey-medium uppercase font-bold tracking-normal">{subCollectionNameUnderwear} Cover Image (4:5 ratio requested)</label>
                                            {collection.coverImageUnderwear ? (
                                                <div className="relative aspect-[4/5] max-w-[240px] border">
                                                    <img src={collection.coverImageUnderwear} className="w-full h-full object-cover" />
                                                    <button onClick={() => handleUpdate({ coverImageUnderwear: '' })} className="absolute top-2 right-2 bg-white/80 p-2 shadow rounded-full cursor-pointer hover:bg-white"><Icons.X size={16}/></button>
                                                </div>
                                            ) : (
                                                <label className="aspect-[4/5] max-w-[240px] border-2 border-dashed flex flex-col items-center justify-center cursor-pointer hover:border-black transition-all group">
                                                    <Icons.Upload size={24} className="text-gray-300 group-hover:text-black" />
                                                    <span className="text-[10px] uppercase font-bold mt-2 text-gray-400">Upload Underwear Cover</span>
                                                    <input type="file" className="hidden" onChange={async (e) => {
                                                        if (!e.target.files?.[0]) return;
                                                        setIsUploading(true);
                                                        try {
                                                            const url = await uploadToCloudinary(e.target.files[0]);
                                                            handleUpdate({ coverImageUnderwear: url });
                                                            notify('Underwear Cover updated', 'success');
                                                        } catch (err) {
                                                            notify('Upload failed', 'error');
                                                        } finally {
                                                            setIsUploading(false);
                                                        }
                                                    }} />
                                                </label>
                                            )}
                                        </div>
                                    </div>
                                </section>

                                <section className="space-y-10">
                                    <div className="flex justify-between items-center border-b pb-6">
                                        <h3 className="text-[15px] font-bold uppercase tracking-[0.1em]">Influencer Access Codes</h3>
                                        <div className="flex space-x-4">
                                            <label className="text-[14px] uppercase font-bold text-black border-2 border-black px-6 py-2 flex items-center cursor-pointer hover:bg-black hover:text-white transition-colors">
                                                <Icons.Spreadsheet size={18} className="mr-2"/> Bulk Upload (.csv)
                                                <input type="file" accept=".csv" className="hidden" onChange={handleCodeBulkUpload} />
                                            </label>
                                            <button onClick={() => {
                                                const newCode = { code: generateId().substring(0,6), limitMain: 3, limitUnderwear: 2 };
                                                handleUpdate({ accessCodesV2: [...accessCodes, newCode] });
                                            }} className="text-[14px] uppercase font-bold text-white bg-black px-6 py-2 flex items-center"><Icons.Plus size={18} className="mr-2"/> Add Code</button>
                                        </div>
                                    </div>
                                    <p className="text-xs text-gray-400 uppercase tracking-wider">* CSV Format: code, limitMain, limitUnderwear (e.g. "GIRLSOUT12,3,2")</p>
                                    <div className="grid gap-8">
                                        {accessCodes.map((ac, idx) => {
                                            const isUnique = isCodeGloballyUnique(ac.code, collection.id, accessCodes);
                                            return (
                                                <div key={idx} className={`flex flex-col xl:flex-row items-stretch xl:items-end gap-6 p-8 border transition-colors ${!isUnique ? 'border-red-500 bg-red-50' : 'bg-gray-50/30'}`}>
                                                    <div className="flex-1 space-y-4 min-w-[200px]">
                                                        <label className="text-[12px] text-grey-light uppercase tracking-normal font-bold">Code</label>
                                                        <div className="relative">
                                                            <input type="text" className={`w-full bg-white border-b-2 py-3 px-3 outline-none text-[16px] uppercase font-bold transition-colors ${!isUnique ? 'border-red-500 focus:border-red-600' : 'focus:border-black'}`} value={ac.code} onChange={e => {
                                                                const codes = [...accessCodes];
                                                                codes[idx].code = e.target.value.trim();
                                                                handleUpdate({ accessCodesV2: codes }, true);
                                                            }} />
                                                            {!isUnique && <div className="mt-2 text-[10px] text-red-600 font-bold uppercase tracking-tight flex items-center"><Icons.Alert size={14} className="mr-1"/> 이미 사용 중인 코드입니다.</div>}
                                                        </div>
                                                    </div>
                                                    <div className="flex items-center space-x-2 pt-2 xl:pb-3">
                                                        <label className="flex items-center space-x-2 text-[12px] font-bold uppercase cursor-pointer select-none">
                                                            <input 
                                                                type="checkbox" 
                                                                checked={!!ac.isUnlimited} 
                                                                onChange={e => {
                                                                    const codes = [...accessCodes];
                                                                    codes[idx].isUnlimited = e.target.checked;
                                                                    handleUpdate({ accessCodesV2: codes }, true);
                                                                }} 
                                                                className="accent-black w-4 h-4 rounded" 
                                                            />
                                                            <span className="text-[12px] font-bold uppercase tracking-wide">Unlimited / 무제한</span>
                                                        </label>
                                                    </div>
                                                    <div className={`w-full sm:w-48 space-y-4 ${ac.isUnlimited ? 'opacity-40' : ''}`}>
                                                        <label className="text-[12px] text-grey-light uppercase tracking-normal font-bold">Main Limit</label>
                                                        <input 
                                                            type="number" 
                                                            disabled={!!ac.isUnlimited}
                                                            className="w-full bg-white border-b-2 py-3 px-3 focus:border-black outline-none text-[16px] font-medium" 
                                                            value={ac.isUnlimited ? '' : (ac.limitMain !== undefined ? ac.limitMain : (ac.limit || 3))} 
                                                            placeholder="∞"
                                                            onChange={e => {
                                                                const codes = [...accessCodes];
                                                                codes[idx].limitMain = parseInt(e.target.value) || 0;
                                                                handleUpdate({ accessCodesV2: codes }, true);
                                                            }} 
                                                        />
                                                    </div>
                                                    <div className={`w-full sm:w-48 space-y-4 ${ac.isUnlimited ? 'opacity-40' : ''}`}>
                                                        <label className="text-[12px] text-grey-light uppercase tracking-normal font-bold">Underwear Limit</label>
                                                        <input 
                                                            type="number" 
                                                            disabled={!!ac.isUnlimited}
                                                            className="w-full bg-white border-b-2 py-3 px-3 focus:border-black outline-none text-[16px] font-medium" 
                                                            value={ac.isUnlimited ? '' : (ac.limitUnderwear !== undefined ? ac.limitUnderwear : 2)} 
                                                            placeholder="∞"
                                                            onChange={e => {
                                                                const codes = [...accessCodes];
                                                                codes[idx].limitUnderwear = parseInt(e.target.value) || 0;
                                                                handleUpdate({ accessCodesV2: codes }, true);
                                                            }} 
                                                        />
                                                    </div>
                                                    <button onClick={() => handleUpdate({ accessCodesV2: accessCodes.filter((_, i) => i !== idx) })} className="p-3 bg-black text-white hover:bg-black/80 transition-colors rounded self-stretch xl:self-end flex items-center justify-center cursor-pointer mt-4 xl:mt-0 xl:h-[50px]"><Icons.Trash size={20}/></button>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </section>
                                <section className="space-y-10">
                                    <h3 className="text-[15px] font-bold uppercase tracking-[0.1em] border-b pb-6">Collection Details</h3>
                                    <input placeholder="TITLE" className="w-full text-5xl font-light tracking-normal border-b-2 py-6 outline-none focus:border-black uppercase" value={collection.descriptionTitle} onChange={e => handleUpdate({ descriptionTitle: e.target.value }, true)} />
                                    <textarea placeholder="STORY CONTENT" className="w-full h-64 border-2 p-10 text-[16px] font-light outline-none focus:border-black leading-relaxed" value={collection.descriptionBody} onChange={e => handleUpdate({ descriptionBody: e.target.value }, true)} />
                                </section>
                                <section className="space-y-10">
                                    <h3 className="text-[15px] font-bold uppercase tracking-[0.1em] border-b pb-6">Lookbook</h3>
                                    <div className="grid grid-cols-2 sm:grid-cols-4 lg:gap-0">
                                        {(collection.lookbookImages || []).map((img, i) => (
                                            <div key={i} className="relative group bg-transparent border overflow-hidden">
                                                <img src={img} className="w-full h-auto block" />
                                                <button onClick={() => { const next = [...collection.lookbookImages]; next.splice(i, 1); handleUpdate({ lookbookImages: next }); }} className="absolute top-4 right-4 bg-white/80 p-3 opacity-0 group-hover:opacity-100 shadow transition-opacity z-10"><Icons.X size={20}/></button>
                                            </div>
                                        ))}
                                        <label className={`aspect-[1/1.5] border-2 border-dashed flex flex-col items-center justify-center cursor-pointer hover:border-black transition-all group ${isUploading ? 'opacity-50 pointer-events-none' : ''}`}>
                                            <Icons.Upload size={32} className={`text-gray-200 group-hover:text-black ${isUploading ? 'animate-spin' : ''}`} />
                                            <input type="file" multiple className="hidden" onChange={handleLookbookUpload} />
                                        </label>
                                    </div>
                                </section>
                                <div className="pt-24 text-center">
                                    <button 
                                        onClick={handleDeleteCollection} 
                                        className="text-red-400 text-[14px] uppercase font-bold px-16 py-5 bg-red-50 rounded-full hover:bg-red-100 transition-colors"
                                    >
                                        Delete Collection
                                    </button>
                                </div>
                            </div>
                        )}
                        {activeSubView === 'products' && (
                            <div className="max-w-6xl mx-auto space-y-16">
                                <div className="flex justify-between items-end border-b pb-8">
