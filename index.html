                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left text-sm border-collapse">
                                                <thead>
                                                    <tr className="bg-gray-50 border-b border-gray-100 text-[10px] uppercase font-bold tracking-wider text-gray-500">
                                                        <th className="p-4">Product Name (제품명)</th>
                                                        <th className="p-4">Category (카테고리)</th>
                                                        <th className="p-4 text-center">Size (사이즈)</th>
                                                        <th className="p-4 text-center">Initial Stock (초기 재고)</th>
                                                        <th className="p-4 text-center">Current Stock (현재 재고)</th>
                                                        <th className="p-4 text-center">Cumulative Orders (누적 주문)</th>
                                                        <th className="p-4 text-center">Stock Level (재고율)</th>
                                                        <th className="p-4 text-center">Display Status</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-gray-100 text-xs">
                                                    {productsList.length === 0 ? (
                                                        <tr>
                                                            <td colSpan="8" className="p-12 text-center text-gray-400 uppercase font-bold tracking-wider">No products available in database</td>
                                                        </tr>
                                                    ) : (
                                                        productsList.flatMap(p => {
                                                            return p.options.map((sz, szIdx) => {
                                                                const sizeKey = sz.trim();
                                                                const initStock = (p.initialInventory && p.initialInventory[sizeKey] !== undefined) ? Number(p.initialInventory[sizeKey]) : 10;
                                                                const currStock = (p.inventory && p.inventory[sizeKey] !== undefined) ? Number(p.inventory[sizeKey]) : 10;
                                                                
                                                                const ordersCount = shippingEntries.filter(e => 
                                                                    e.productName && e.productName.trim().toLowerCase() === p.name.trim().toLowerCase() && 
                                                                    e.size && e.size.trim().toLowerCase() === sizeKey.toLowerCase()
                                                                ).length;

                                                                const stockPercent = initStock > 0 ? Math.round((currStock / initStock) * 100) : 0;
                                                                const catLabel = (p.subCollection === 'underwear') ? subCollectionNameUnderwear : subCollectionNameMain;
                                                                const isSizeHidden = (p.isHidden && p.isHidden[sizeKey] === true);

                                                                return (
                                                                    <tr key={`${p.id}-${sizeKey}`} className="hover:bg-gray-50/50 transition-colors">
                                                                        {szIdx === 0 ? (
                                                                            <td className="p-4 font-bold border-r border-gray-100 uppercase" rowSpan={p.options.length}>
                                                                                <div className="flex items-center space-x-3">
                                                                                    {p.images && p.images[0] && (
                                                                                        <img src={p.images[0]} className="w-8 h-10 object-cover border" />
                                                                                    )}
                                                                                    <span>{p.name}</span>
                                                                                </div>
                                                                            </td>
                                                                        ) : null}
                                                                        {szIdx === 0 ? (
                                                                            <td className="p-4 font-medium text-gray-600 uppercase" rowSpan={p.options.length}>
                                                                                {catLabel}
                                                                            </td>
                                                                        ) : null}
                                                                        <td className="p-4 text-center font-bold text-black uppercase border-l border-gray-50">{sizeKey}</td>
                                                                        <td className="p-4 text-center font-mono text-gray-500">{initStock}</td>
                                                                        <td className="p-4 text-center font-mono font-bold text-black">{currStock}</td>
                                                                        <td className="p-4 text-center font-mono text-blue-600 font-bold bg-blue-50/30">{ordersCount}</td>
                                                                        <td className="p-4">
                                                                            <div className="flex items-center justify-center space-x-2">
                                                                                <div className="w-16 bg-gray-100 h-1.5 rounded-full overflow-hidden">
                                                                                    <div 
                                                                                        className={`h-full ${currStock <= 0 ? 'bg-red-500' : currStock < 3 ? 'bg-orange-400' : 'bg-green-500'}`} 
                                                                                        style={{ width: `${Math.min(100, stockPercent)}%` }}
                                                                                    />
                                                                                </div>
                                                                                <span className="text-[9px] font-mono font-bold text-gray-500">{stockPercent}%</span>
                                                                            </div>
                                                                        </td>
                                                                        <td className="p-4 text-center">
                                                                            <button 
                                                                                onClick={() => {
                                                                                    const nextIsHidden = { ...(p.isHidden || {}) };
                                                                                    nextIsHidden[sizeKey] = !nextIsHidden[sizeKey];
                                                                                    handleUpdate({
                                                                                        products: collection.products.map(x => x.id === p.id ? { ...x, isHidden: nextIsHidden } : x)
                                                                                    });
                                                                                }}
                                                                                className={`px-3 py-1 text-[11px] font-bold uppercase transition-colors border text-center rounded whitespace-nowrap ${
                                                                                    !isSizeHidden ? 'bg-green-50 text-green-700 border-green-200 hover:bg-green-100' : 'bg-red-50 text-red-700 border-red-200 hover:bg-red-100'
                                                                                }`}
                                                                            >
                                                                                {!isSizeHidden ? 'Active (노출)' : 'Hidden (숨김)'}
                                                                            </button>
                                                                        </td>
                                                                    </tr>
                                                                );
                                                            });
                                                        })
                                                    )}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            );
                        })()}
                    </main>
                    <SyncMonitor />
                    <Toast error={error} success={success} />
                </div>
            );
        };

        const InfluencerPage = ({ collection, cart, setCart, onLogout, notify, onSubmission, scrollPosRef, error, success, loginCode }) => {
            const [view, setView] = useState('lookbook');
            const [activeSlide, setActiveSlide] = useState(0);
            const [selectedProd, setSelectedProd] = useState(null);
            const [selectedSize, setSelectedSize] = useState('');
            const [activeImageIndex, setActiveImageIndex] = useState(0);
            const [formData, setFormData] = useState({ instagramId: '', name: '', phone: '', address: '', message: '', extra: '', agreed: false });
            
            // Sub collection page state (null means card chooser is shown)
            const [activePackage, setActivePackage] = useState(null);

            const isSingleCollectionOnly = useMemo(() => {
                const subcols = new Set();
                const products = collection.products || [];
                if (products.length === 0) return true;
                products.forEach(p => {
                    subcols.add(p.subCollection || 'main');
                });
                return subcols.size <= 1;
            }, [collection.products]);

            const singleCollectionSubcol = useMemo(() => {
                const products = collection.products || [];
                if (products.length === 0) return 'main';
                return products[0].subCollection || 'main';
            }, [collection.products]);

            useEffect(() => {
                if (isSingleCollectionOnly) {
                    setActivePackage(singleCollectionSubcol);
                }
            }, [isSingleCollectionOnly, singleCollectionSubcol]);

            const [touchStart, setTouchStart] = useState(null);
            const [touchEnd, setTouchEnd] = useState(null);
            const minSwipeDistance = 50;

            const subCollectionNameMain = collection.subCollectionNameMain || 'Nuuanu Main Collection';
            const subCollectionNameUnderwear = collection.subCollectionNameUnderwear || 'Nuuanu Underwear Collection';

            // Extract limit configuration from access code
            const matchedAccessCodeObj = useMemo(() => {
                const acs = (collection && collection.accessCodesV2) || [];
                return acs.find(a => a.code && a.code.toLowerCase().trim() === loginCode.toLowerCase().trim());
            }, [collection, loginCode]);

            const isUnlimited = useMemo(() => {
                return !!(matchedAccessCodeObj && matchedAccessCodeObj.isUnlimited);
            }, [matchedAccessCodeObj]);

            const limitMain = useMemo(() => {
                if (!matchedAccessCodeObj) return 3;
                if (matchedAccessCodeObj.limitMain !== undefined) return matchedAccessCodeObj.limitMain;
                return matchedAccessCodeObj.limit || 3;
            }, [matchedAccessCodeObj]);

            const limitUnderwear = useMemo(() => {
                if (!matchedAccessCodeObj) return 2;
                if (matchedAccessCodeObj.limitUnderwear !== undefined) return matchedAccessCodeObj.limitUnderwear;
                return 2;
            }, [matchedAccessCodeObj]);

            useLayoutEffect(() => { 
                if (view === 'lookbook' && scrollPosRef.current > 0) setTimeout(() => window.scrollTo({ top: scrollPosRef.current, behavior: 'instant' }), 0); 
            }, [view]);

            const handleNav = (v) => { 
                if (view === 'lookbook') scrollPosRef.current = window.scrollY; 
                setView(v); window.scrollTo(0, 0); 
            };

            const next = () => { 
                if(!(collection.lookbookImages?.length)) return; 
                setActiveSlide(p => (p + 2) >= collection.lookbookImages.length ? 0 : p + 2); 
            };
            const prev = () => { 
                if(!(collection.lookbookImages?.length)) return; 
                setActiveSlide(p => p - 2 < 0 ? Math.max(0, collection.lookbookImages.length - (collection.lookbookImages.length % 2 || 2)) : p - 2); 
            };
            
            const handleTouchStart = (e) => {
                setTouchEnd(null);
                setTouchStart(e.targetTouches[0].clientX);
            };

            const handleTouchMove = (e) => {
                setTouchEnd(e.targetTouches[0].clientX);
            };

            const handleTouchEnd = () => {
                if (!touchStart || !touchEnd) return;
                const distance = touchStart - touchEnd;
                const isLeftSwipe = distance > minSwipeDistance;
                const isRightSwipe = distance < -minSwipeDistance;
                if (isLeftSwipe) next();
                if (isRightSwipe) prev();
            };

            // Calculate cart quantities based on package type
            const selectedMainCount = useMemo(() => {
                return cart.filter(item => (item.subCollection || 'main') === 'main').length;
            }, [cart]);

            const selectedUnderwearCount = useMemo(() => {
                return cart.filter(item => item.subCollection === 'underwear').length;
            }, [cart]);

            const addToCart = () => { 
                if(!selectedProd || !selectedSize) { alert('Select size preference'); return; } 
                
                const prodSubCol = selectedProd.subCollection || 'main';
                if (!isUnlimited) {
                    if (prodSubCol === 'underwear') {
                        if (selectedUnderwearCount >= limitUnderwear) {
                            alert(`${subCollectionNameUnderwear}은(는) 최대 ${limitUnderwear}개까지만 선택할 수 있습니다.`);
                            return;
                        }
                    } else {
                        if (selectedMainCount >= limitMain) {
                            alert(`${subCollectionNameMain}은(는) 최대 ${limitMain}개까지만 선택할 수 있습니다.`);
                            return;
                        }
                    }
                }

                setCart([...cart, { 
                    id: generateId(), 
                    productName: selectedProd.name, 
                    size: selectedSize, 
                    image: (selectedProd.images && selectedProd.images[0]) || 'https://picsum.photos/400/600',
                    subCollection: prodSubCol
                }]); 
                notify('Added to selection', 'success'); 
                handleNav('lookbook'); 
            };

            const submit = () => { 
                if(!formData.instagramId || !formData.name || !formData.phone || !formData.address || !formData.agreed) { alert('Check required fields'); return; } 
                const cleanedInstaId = cleanInstaId(formData.instagramId);
                onSubmission(cart.map(item => ({ 
                    id: generateId(), 
                    status: '준비중', 
                    submitDate: new Date().toISOString().split('T')[0], 
                    ...formData, 
                    instagramId: cleanedInstaId,
                    productName: item.productName, 
                    size: item.size, 
                    quantity: 1, 
                    usedCode: loginCode, 
                    subCollection: item.subCollection || 'main',
                    adminMemo: '',
                    isManual: false 
                }))); 
                setView('success'); setCart([]); 
            };

            if (view === 'success') return (
                <div className="min-h-screen flex flex-col items-center justify-center p-12 text-center space-y-12 animate-fade-in">
                    <Icons.Success size={80} strokeWidth={1}/>
                    <h2 className="text-2xl font-light tracking-[0.1em] uppercase">Complete</h2>
                    <p className="text-sm font-light text-grey-medium max-w-sm">Thank you, nuuanu girl! We love having you as part of our journey✨</p>
                    <button onClick={onLogout} className="text-[10px] tracking-[0.125em] border-b border-black pb-1 uppercase font-bold cursor-pointer">Sign Out</button>
                </div>
            );

            // Filter products matching current subcollection package
            const filteredProducts = (collection.products || []).filter(p => {
                const sub = p.subCollection || 'main';
                if (sub !== activePackage) return false;
                if (p.isAvailable === false) return false;
                
                // If product has sizes, verify there's at least one size with stock > 0 and not hidden
                if (p.options && p.options.length > 0) {
                    const hasStock = p.options.some(s => {
                        const sizeKey = s.trim();
                        const stock = (p.inventory && p.inventory[sizeKey] !== undefined) ? Number(p.inventory[sizeKey]) : 10;
                        const isSizeHidden = (p.isHidden && p.isHidden[sizeKey] === true);
                        return stock > 0 && !isSizeHidden;
                    });
                    if (!hasStock) return false;
                }
                
                return true;
            });

            return (
                <div className="min-h-screen bg-white pb-40 animate-fade-in">
                    <header className="sticky top-0 bg-white/95 backdrop-blur-md z-40 border-b border-gray-100">
                        <div className="px-10 py-8 flex justify-between items-center bg-white/95 backdrop-blur-md">
                            <h1 className="text-2xl font-light tracking-[0.125em] uppercase cursor-pointer" onClick={() => { if(!isSingleCollectionOnly) setActivePackage(null); handleNav('lookbook'); }}>nuuanu</h1>
                            <div className="flex items-center space-x-6">
                                <button onClick={() => handleNav('cart')} className="relative flex items-center transition-transform active:scale-90 p-1 cursor-pointer">
                                    <Icons.ShoppingBag size={28} />
                                    {cart.length > 0 && <span className="absolute -top-1 -right-1 bg-black text-white text-[8px] w-4 h-4 rounded-full flex items-center justify-center font-bold">{cart.length}</span>}
                                </button>
                                <button onClick={onLogout} className="text-[11px] font-bold uppercase tracking-[0.125em] text-grey-medium hover:text-black transition-all cursor-pointer">
                                    logout
                                </button>
                            </div>
                        </div>
                        {/* Sticky Package Back Navigation */}
                        {activePackage !== null && view === 'lookbook' && !isSingleCollectionOnly && (
                            <div className="px-10 py-4 bg-gray-50/50 border-t border-gray-100 flex justify-between items-center animate-fade-in">
                                <button 
                                    onClick={() => { setActivePackage(null); }} 
                                    className="text-[11px] tracking-[0.1em] uppercase flex items-center hover:text-gray-400 font-bold cursor-pointer border-b border-black pb-0.5"
                                >
                                    <Icons.ChevronLeft size={16} className="mr-1" /> Choose Other Package
                                </button>
                                <div className="text-right">
                                    <h3 className="text-[11px] font-bold uppercase tracking-[0.1em] text-black">
                                        {activePackage === 'underwear' ? subCollectionNameUnderwear : subCollectionNameMain}
                                    </h3>
                                    {!isUnlimited && (
                                        <p className="text-[10px] uppercase tracking-[0.05em] text-grey-medium font-bold">
                                            {activePackage === 'underwear' ? `${selectedUnderwearCount} / ${limitUnderwear}` : `${selectedMainCount} / ${limitMain}`} Items Selected
                                        </p>
                                    )}
                                </div>
                            </div>
                        )}
                    </header>
                    {view === 'lookbook' && (
                        <main className="animate-fade-in">
                            <section 
                                className="relative px-0 py-10 overflow-hidden text-center"
                                onTouchStart={handleTouchStart}
                                onTouchMove={handleTouchMove}
                                onTouchEnd={handleTouchEnd}
                            >
                                <div className="grid grid-cols-1 md:grid-cols-2 max-w-7xl mx-auto relative group">
                                    {(collection.lookbookImages && collection.lookbookImages.length > 0) ? (
                                        <>
                                            <div className="aspect-[2/3] bg-transparent overflow-hidden relative">
                                                <img src={collection.lookbookImages[activeSlide]} className="w-full h-full object-cover block" />
                                            </div>
                                            <div className="hidden md:block aspect-[2/3] bg-transparent overflow-hidden relative">
                                                <img src={collection.lookbookImages[activeSlide+1] || collection.lookbookImages[0]} className="w-full h-full object-cover block" />
                                            </div>
                                        </>
                                    ) : (
                                        <div className="col-span-2 aspect-[2/1.5] bg-transparent flex items-center justify-center text-[10px] tracking-[0.1em] text-grey-medium uppercase">Lookbook coming soon</div>
                                    )}

                                    {collection.lookbookImages && collection.lookbookImages.length > 2 && (
                                        <>
                                            <button 
                                                onClick={prev} 
                                                className="absolute left-3 md:left-6 top-1/2 -translate-y-1/2 z-30 p-2 text-white bg-transparent hover:opacity-70 transition-all drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)] flex items-center justify-center cursor-pointer"
                                            >
                                                <Icons.ChevronLeft width={24} height={24} className="md:w-10 md:h-10" />
                                            </button>
                                            <button 
                                                onClick={next} 
                                                className="absolute right-3 md:right-6 top-1/2 -translate-y-1/2 z-30 p-2 text-white bg-transparent hover:opacity-70 transition-all drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)] flex items-center justify-center cursor-pointer"
                                            >
                                                <Icons.ChevronRight width={24} height={24} className="md:w-10 md:h-10" />
                                            </button>
                                        </>
                                    )}
                                </div>
                            </section>
                            <section className="max-w-2xl mx-auto text-center mt-6 mb-20 px-10 space-y-6">
                                <h2 className="text-2xl font-light tracking-[0.125em] uppercase border-b border-gray-100 pb-4 inline-block">{collection.descriptionTitle}</h2>
                                <div className="text-sm font-light leading-relaxed tracking-[0.05em] text-grey-dark" dangerouslySetInnerHTML={{ __html: (collection.descriptionBody || '').replace(/\n/g, '<br/>') }} />
                            </section>

                            {/* Gateway Page: ActivePackage is null */}
                            {activePackage === null ? (
                                <section className="max-w-4xl mx-auto px-10 animate-fade-in">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-12">
                                        {/* Card 1: Main Collection */}
                                        <div 
                                            onClick={() => { setActivePackage('main'); window.scrollTo(0,400); }} 
                                            className="relative overflow-hidden aspect-[4/5] transition-all shadow-md hover:shadow-2xl cursor-pointer group"
                                        >
                                            <img 
                                                src={collection.coverImageMain || (collection.lookbookImages && collection.lookbookImages[0]) || 'https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&q=80&w=800'} 
                                                className="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" 
                                            />
                                            <div className="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/85 via-black/40 to-transparent pt-32 pb-8 px-8 flex flex-col justify-end text-left h-full">
                                                <h4 className="text-white text-md font-bold uppercase tracking-wider mb-2">{subCollectionNameMain}</h4>
                                                {!isUnlimited && (
                                                    <p className="text-white/80 text-xs font-bold uppercase tracking-[0.075em]">
                                                        LIMIT {selectedMainCount}/{limitMain}
                                                    </p>
                                                )}
                                            </div>
                                        </div>

                                        {/* Card 2: Underwear Collection */}
                                        <div 
                                            onClick={() => { setActivePackage('underwear'); window.scrollTo(0,400); }} 
                                            className="relative overflow-hidden aspect-[4/5] transition-all shadow-md hover:shadow-2xl cursor-pointer group"
                                        >
                                            <img 
                                                src={collection.coverImageUnderwear || (collection.lookbookImages && collection.lookbookImages[1]) || (collection.lookbookImages && collection.lookbookImages[0]) || 'https://images.unsplash.com/photo-1541643600914-78b084683601?auto=format&fit=crop&q=80&w=800'} 
                                                className="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" 
                                            />
                                            <div className="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/85 via-black/40 to-transparent pt-32 pb-8 px-8 flex flex-col justify-end text-left h-full">
                                                <h4 className="text-white text-md font-bold uppercase tracking-wider mb-2">{subCollectionNameUnderwear}</h4>
                                                {!isUnlimited && (
                                                    <p className="text-white/80 text-xs font-bold uppercase tracking-[0.075em]">
                                                        LIMIT {selectedUnderwearCount}/{limitUnderwear}
                                                    </p>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                </section>
                            ) : (
                                /* Products List screen within subcollection packaging */
                                <section className="max-w-6xl mx-auto px-10 animate-fade-in">
                                    {isSingleCollectionOnly ? (
                                        <div className="flex justify-end border-b border-gray-100 pb-6 mb-10">
                                            <div className="text-right">
                                                <h3 className="text-[14px] font-bold uppercase tracking-[0.125em] text-black">
                                                    {activePackage === 'underwear' ? subCollectionNameUnderwear : subCollectionNameMain}
                                                </h3>
                                                {!isUnlimited && (
                                                    <p className="text-[11px] font-bold uppercase tracking-[0.05em] text-grey-medium mt-1">
                                                        Selection: {activePackage === 'underwear' ? `${selectedUnderwearCount} / ${limitUnderwear}` : `${selectedMainCount} / ${limitMain}`} Items Selected
                                                    </p>
                                                )}
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-end border-b border-gray-100 pb-6 mb-10 gap-4">
                                            <button 
                                                onClick={() => { setActivePackage(null); }} 
                                                className="text-[11px] tracking-[0.1em] uppercase flex items-center hover:text-gray-400 font-bold cursor-pointer border-b border-black pb-1"
                                            >
                                                <Icons.ChevronLeft size={16} className="mr-1" /> Choose Other Package
                                            </button>
                                            <div className="text-right">
                                                <h3 className="text-[14px] font-bold uppercase tracking-[0.125em] text-black">
                                                    {activePackage === 'underwear' ? subCollectionNameUnderwear : subCollectionNameMain}
                                                </h3>
                                                {!isUnlimited && (
                                                    <p className="text-[11px] font-bold uppercase tracking-[0.05em] text-grey-medium mt-1">
                                                        Selection: {activePackage === 'underwear' ? `${selectedUnderwearCount} / ${limitUnderwear}` : `${selectedMainCount} / ${limitMain}`} Items Selected
                                                    </p>
                                                )}
                                            </div>
                                        </div>
                                    )}

                                    {filteredProducts.length === 0 ? (
                                        <div className="py-24 text-center text-grey-medium uppercase tracking-[0.1em] text-xs">
                                            이 컬렉션에 등록된 제품이 없습니다.
                                        </div>
                                    ) : (
                                        <div className="product-grid">
                                            {filteredProducts.map(p => (
                                                <div key={p.id} className="group cursor-pointer" onClick={() => { setSelectedProd(p); setActiveImageIndex(0); setSelectedSize(''); handleNav('product_detail'); }}>
                                                    <div className="mb-2 overflow-hidden relative bg-transparent">
                                                        <img src={(p.images && p.images[0]) || 'https://picsum.photos/seed/nuuanu/400/600'} className="w-full aspect-[3/4] object-cover group-hover:scale-110 transition-transform duration-[2000ms]" />
                                                    </div>
                                                    <div className="space-y-1">
                                                        <h4 className="text-[12px] font-normal tracking-normal uppercase">{p.name}</h4>
                                                        <p className="text-[10px] text-grey-medium uppercase">KRW {p.price}</p>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </section>
                            )}
                        </main>
                    )}
                    {view === 'product_detail' && selectedProd && (
                        <main className="max-w-6xl mx-auto px-10 pt-16 animate-fade-in">
                            <button onClick={() => handleNav('lookbook')} className="text-[11px] tracking-[0.1em] uppercase mb-24 flex items-center hover:text-gray-400 font-bold cursor-pointer">
                                <Icons.ChevronLeft size={18} className="mr-1" /> Back
                            </button>
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-32">
                                <div className="space-y-10">
                                    <div className="bg-transparent shadow-2xl overflow-hidden relative">
                                        <img src={(selectedProd.images && selectedProd.images[activeImageIndex]) || 'https://picsum.photos/400/600'} className="w-full h-auto block" />
                                    </div>
                                    <div className="grid grid-cols-4 gap-6">
                                        {(selectedProd.images || []).map((img, i) => (
                                            <div key={i} onClick={() => setActiveImageIndex(i)} className={`cursor-pointer bg-transparent border shadow-sm overflow-hidden aspect-[2/3] relative transition-all duration-200 ${activeImageIndex === i ? 'border-black ring-1 ring-black scale-95' : 'border-gray-100 hover:border-gray-400 opacity-70 hover:opacity-100'}`}>
                                                <img src={img} className="w-full h-full object-cover block" />
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <div className="space-y-20">
                                    <div className="border-b pb-12 border-gray-100">
                                        <span className="text-[10px] tracking-widest font-bold uppercase bg-gray-150 py-1 px-3 border rounded-full text-grey-medium">
                                            {(selectedProd.subCollection === 'underwear') ? subCollectionNameUnderwear : subCollectionNameMain}
                                        </span>
                                        <h2 className="text-xl font-light tracking-tight uppercase mb-4 mt-4">{selectedProd.name}</h2>
                                        <p className="text-grey-medium tracking-[0.125em] text-sm uppercase font-light mb-8">KRW {selectedProd.price}</p>
                                        <div className="text-sm leading-relaxed text-grey-dark font-light" dangerouslySetInnerHTML={{ __html: (selectedProd.description || '').replace(/\n/g, '<br/>') }} />
                                    </div>
                                    <div className="space-y-10">
                                        <p className="text-[11px] tracking-[0.125em] uppercase font-bold">Size Preference</p>
                                        <div className="flex flex-wrap gap-2 sm:gap-3">
                                            {(selectedProd.options || []).map(s => {
                                                const sizeKey = s.trim();
                                                const stock = (selectedProd.inventory && selectedProd.inventory[sizeKey] !== undefined) ? Number(selectedProd.inventory[sizeKey]) : 10;
                                                const isSizeHidden = (selectedProd.isHidden && selectedProd.isHidden[sizeKey] === true);
                                                if (stock <= 0 || isSizeHidden) return null;
                                                return (
                                                    <button 
                                                        key={s} 
                                                        onClick={() => setSelectedSize(s)} 
                                                        className={`w-14 h-10 sm:w-16 sm:h-11 rounded-full border text-[11px] font-bold tracking-[0.05em] uppercase transition-all flex items-center justify-center cursor-pointer ${selectedSize === s ? 'bg-black text-white border-black shadow-lg scale-105' : 'border-gray-200 hover:border-black bg-white text-black'}`}
                                                    >
                                                        {s}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                    <div className="pt-10">
                                        <button onClick={addToCart} className="w-full bg-black text-white py-8 text-[11px] tracking-[0.15em] font-bold shadow-2xl active:scale-[0.98] uppercase cursor-pointer">Add to My Selection</button>
                                    </div>
                                </div>
                            </div>
                        </main>
                    )}
                    {view === 'cart' && (
                        <main className="max-w-2xl mx-auto px-10 pt-16 animate-fade-in">
                            <button onClick={() => handleNav('lookbook')} className="text-[11px] tracking-[0.1em] uppercase mb-24 flex items-center hover:text-gray-400 font-bold cursor-pointer"><Icons.ChevronLeft size={18} className="mr-1" /> Back</button>
                            
                            {!isUnlimited && (
                                <div className="border-b pb-10 mb-20 border-gray-100 space-y-4">
                                    <h2 className="text-xs font-bold uppercase tracking-[0.125em]">Selected List</h2>
                                    <div className="grid grid-cols-2 gap-4 pt-2">
                                        <div className="bg-gray-50/50 p-4 text-center border">
                                            <p className="text-[9px] text-grey-light uppercase tracking-wider">{subCollectionNameMain}</p>
                                            <p className="text-lg font-bold">{selectedMainCount} / {limitMain}</p>
                                        </div>
                                        <div className="bg-gray-50/50 p-4 text-center border">
                                            <p className="text-[9px] text-grey-light uppercase tracking-wider">{subCollectionNameUnderwear}</p>
                                            <p className="text-lg font-bold">{selectedUnderwearCount} / {limitUnderwear}</p>
                                        </div>
                                    </div>
                                </div>
                            )}

                            <div className="space-y-16 mb-32">
                                {cart.length === 0 ? (
                                    <div className="py-12 text-center text-xs uppercase text-grey-light">선택한 아이템이 없습니다.</div>
                                ) : (
                                    cart.map((item, i) => (
                                        <div key={i} className="flex space-x-10 items-center group">
                                            <div className="w-28 bg-transparent shadow-2xl overflow-hidden relative">
                                                <img src={item.image} className="w-full h-auto block" />
                                            </div>
                                            <div className="flex-1 space-y-2">
                                                <span className={`text-[9px] font-bold tracking-widest px-2.5 py-0.5 border rounded-full ${item.subCollection === 'underwear' ? 'bg-purple-50 border-purple-100 text-purple-600' : 'bg-blue-50 border-blue-100 text-blue-600'}`}>
                                                    {item.subCollection === 'underwear' ? 'underwear' : 'main'}
                                                </span>
                                                <h4 className="text-[12px] font-normal uppercase pt-1">{item.productName}</h4>
                                                <p className="text-[10px] text-grey-medium tracking-[0.1em] uppercase">Size: <span className="text-black ml-2 font-bold">{item.size}</span></p>
                                            </div>
                                            <button onClick={() => setCart(cart.filter((_, idx) => idx !== i))} className="text-gray-300 hover:text-red-500 transition-all p-4 cursor-pointer"><Icons.X size={24} /></button>
                                        </div>
                                    ))
                                )}
                            </div>
                            <div className="bg-transparent p-12 space-y-16 shadow-2xl rounded-sm border border-gray-100">
                                <h3 className="text-[11px] font-bold uppercase tracking-[0.125em] border-b pb-8 border-gray-200">Shipping Info</h3>
                                <div className="space-y-10">
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-10">
                                        <input 
                                            placeholder="INSTAGRAM (@)" 
                                            className="w-full border-b border-gray-200 bg-transparent py-5 text-[11px] outline-none uppercase" 
                                            value={formData.instagramId} 
                                            onChange={e => {
                                                const cleaned = e.target.value.replace(/@/g, '').trim();
                                                setFormData({...formData, instagramId: cleaned});
                                            }} 
                                        />
                                        <input placeholder="NAME" className="w-full border-b border-gray-200 bg-transparent py-5 text-[11px] outline-none uppercase" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} />
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-10">
                                        <input placeholder="PHONE" className="w-full border-b border-gray-200 bg-transparent py-5 text-[11px] outline-none uppercase" value={formData.phone} onChange={e => setFormData({...formData, phone: e.target.value})} />
                                        <input placeholder="ADDRESS" className="w-full border-b border-gray-200 bg-transparent py-5 text-[11px] outline-none uppercase" value={formData.address} onChange={e => setFormData({...formData, address: e.target.value})} />
                                    </div>
                                    <textarea placeholder="MESSAGE" className="w-full h-32 border-b border-gray-200 bg-transparent py-5 text-[11px] outline-none resize-none uppercase" value={formData.message} onChange={e => setFormData({...formData, message: e.target.value})} />
                                    
                                    <div className="flex items-start space-x-4 cursor-pointer group py-2">
                                        <input type="checkbox" id="agreement" className="mt-1 w-5 h-5 accent-black cursor-pointer" checked={formData.agreed} onChange={e => setFormData({...formData, agreed: e.target.checked})} />
                                        <label htmlFor="agreement" className="text-[11px] text-black font-medium leading-relaxed select-none cursor-pointer uppercase">
                                            *재고 상황 등에 따라 일부 내용이 달라질 수 있으며, 올려주신 콘텐츠는 브랜드 소개나 홍보에 활용될 수 있음에 동의합니다.
                                        </label>
                                    </div>
                                    <button onClick={submit} className="w-full bg-black text-white py-8 text-[11px] tracking-[0.15em] font-bold shadow-2xl disabled:opacity-30 uppercase transition-all cursor-pointer" disabled={!cart.length || !formData.agreed}>제출하기</button>
                                </div>
                            </div>
                        </main>
                    )}
                    <SyncMonitor />
                    <Toast error={error} success={success} />
                </div>
            );
        };

        const App = () => {
            const [state, setState] = useState({ collections: [], adminAccessCode: 'admin' });
            const [isLoading, setIsLoading] = useState(true);
            const [view, setView] = useState('login');
            const [activeCollection, setActiveCollection] = useState(null);
            const [accessCodeInput, setAccessCodeInput] = useState('');
            const [error, setError] = useState(null);
            const [success, setSuccess] = useState(null);
            const [cart, setCart] = useState([]);
            const [isCreateModalOpen, setIsCreateModalOpen] = useState(false);
            const [newCollectionName, setNewCollectionName] = useState('');
            const [adminSubView, setAdminSubView] = useState('settings');
            const scrollPosRef = useRef(0);

            useEffect(() => {
                const configDocRef = doc(db, 'config', 'global');
                const configUnsub = onSnapshot(configDocRef, (docSnap) => {
                    if (docSnap.exists()) {
                        setState(s => ({ ...s, adminAccessCode: docSnap.data().adminAccessCode || 'admin' }));
                    } else {
                        setDoc(configDocRef, { adminAccessCode: 'admin' });
                    }
                });

                const collUnsub = onSnapshot(collection(db, 'collections'), querySnapshot => {
                    const colls = [];
                    querySnapshot.forEach(docSnap => colls.push({ ...docSnap.data(), firebaseId: docSnap.id }));
                    setState(s => ({ ...s, collections: colls }));
                    setIsLoading(false);
                });

                return () => {
                    configUnsub();
                    collUnsub();
                };
            }, []);

            useEffect(() => {
                if (activeCollection) {
                    const latest = state.collections.find(c => c.id === activeCollection.id);
                    if (latest) setActiveCollection(latest);
                }
            }, [state.collections]);
            
            const notify = (msg, type) => { 
                if (type === 'success') { setSuccess(msg); setTimeout(() => setSuccess(null), 3000); } 
                else { setError(msg); setTimeout(() => setError(null), 3000); } 
            };

            const handleLogin = () => {
                const code = accessCodeInput.trim().toLowerCase();
                if (code === state.adminAccessCode.toLowerCase().trim()) { 
                    setView('select_collection'); 
                } else {
                    const matched = state.collections.find(c => (c.accessCodesV2 || []).some(ac => ac.code && ac.code.toLowerCase().trim() === code));
                    if (matched) { 
                        setActiveCollection(matched); 
                        setView('influencer'); 
                    } else {
                        notify('Invalid Access Code', 'error');
                    }
                }
            };

            const handleLogout = () => { setActiveCollection(null); setView('login'); setAccessCodeInput(''); setCart([]); scrollPosRef.current = 0; };
            
            const createCollection = async (name) => {
                if (!name.trim()) return;
                const newColl = {
                    id: generateId(),
                    name: name.trim(),
                    accessCodesV2: [{ code: generateId().substring(0, 6), limitMain: 3, limitUnderwear: 2 }],
                    lookbookImages: [],
                    descriptionTitle: 'New Story',
                    descriptionBody: 'Collection inspiration...',
                    products: [],
                    shippingEntries: [],
                    subCollectionNameMain: 'Nuuanu Main Collection',
                    subCollectionNameUnderwear: 'Nuuanu Underwear Collection'
                };
                try {
                    await addDoc(collection(db, 'collections'), newColl);
                    setIsCreateModalOpen(false);
                    setNewCollectionName('');
                    notify('Collection Created', 'success');
                } catch (err) {
                    notify('Cloud Save Failed', 'error');
                }
            };

            const cleanAndDiagnoseForFirestore = (val, path = '', visited = new Set()) => {
                if (val === null || val === undefined) return val;
                if (typeof val !== 'object' && typeof val !== 'function') {
                    return val;
                }
                if (typeof val === 'function') {
                    console.warn(`[Firestore Sync Debug] Function removed at: ${path}`);
                    return null;
                }
                if (visited.has(val)) {
                    console.warn(`[Firestore Sync Debug] Circular reference detected and removed at: ${path}`);
                    return '[Circular Reference]';
                }
                if (val instanceof Node || (typeof val.nodeType === 'number') || val === window || val === document) {
                    console.warn(`[Firestore Sync Debug] DOM Node detected and removed at: ${path}. Constructor: ${val.constructor?.name || 'unknown'}`);
                    return `[DOM Node: ${val.constructor?.name || 'Element'}]`;
                }
                if (val.nativeEvent || val._reactName || val.target || val.currentTarget) {
                    console.warn(`[Firestore Sync Debug] React Event detected and removed at: ${path}. Constructor: ${val.constructor?.name || 'SyntheticEvent'}`);
                    return `[Event: ${val.constructor?.name || 'Event'}]`;
                }
                visited.add(val);
                if (Array.isArray(val)) {
                    const cleanedArray = val.map((item, index) => 
                        cleanAndDiagnoseForFirestore(item, path ? `${path}[${index}]` : `[${index}]`, new Set(visited))
                    );
                    return cleanedArray;
                }
                const cleanedObj = {};
                for (const key of Object.keys(val)) {
                    cleanedObj[key] = cleanAndDiagnoseForFirestore(val[key], path ? `${path}.${key}` : key, new Set(visited));
                }
                return cleanedObj;
            };

            const updateCollection = async (updated) => {
                try {
                    const docId = updated.firebaseId;
                    if (!docId) return;
                    const cleanedData = cleanAndDiagnoseForFirestore(updated);
                    const dataToSave = { ...cleanedData };
                    delete dataToSave.firebaseId;
                    await setDoc(doc(db, 'collections', docId), dataToSave);
                } catch (err) {
                    console.error('Firestore Update Failed:', err);
                    notify('Cloud Update Failed', 'error');
                }
            };

            const deleteCollection = async (docId) => {
                try {
                    await deleteDoc(doc(db, 'collections', docId));
                    setView('select_collection');
                    notify('컬렉션이 안전하게 삭제되었습니다.', 'success');
                } catch (err) {
                    notify('Delete Failed', 'error');
                }
            };

            const updateAdminCode = (newCode) => {
                updateDoc(doc(db, 'config', 'global'), { adminAccessCode: newCode });
            };

            const handleInfluencerSubmission = async (entries) => {
                let updatedProducts = [...(activeCollection.products || [])];
                cart.forEach(cartItem => {
                    updatedProducts = updatedProducts.map(p => {
                        if (p.name.trim().toLowerCase() === cartItem.productName.trim().toLowerCase()) {
                            const currentInv = { ...(p.inventory || {}) };
                            const sz = cartItem.size.trim();
                            const currentStock = currentInv[sz] !== undefined ? Number(currentInv[sz]) : 10;
                            currentInv[sz] = Math.max(0, currentStock - 1);

                            // Check if all options are sold out
                            const allSoldOut = (p.options || []).every(szOpt => {
                                const optKey = szOpt.trim();
                                const stockVal = currentInv[optKey] !== undefined ? Number(currentInv[optKey]) : 10;
                                return stockVal <= 0;
                            });

                            return {
                                ...p,
                                inventory: currentInv,
                                isAvailable: allSoldOut ? false : (p.isAvailable !== false)
                            };
                        }
                        return p;
                    });
                });

                await updateCollection({
                    ...activeCollection,
                    products: updatedProducts,
                    shippingEntries: [...(activeCollection.shippingEntries || []), ...entries]
                });
            };

            if (isLoading) return (
                <div className="min-h-screen flex flex-col items-center justify-center p-6 bg-white space-y-6">
                    <div className="loader w-12 h-12"></div>
                    <span className="text-[10px] tracking-[0.125em] uppercase font-bold animate-pulse">nuuanu cloud initializing</span>
                </div>
            );
            
            if (view === 'login') return (
                <div className="min-h-screen flex items-center justify-center p-6 bg-white animate-fade-in"><div className="max-w-md w-full text-center space-y-20"><h1 className="text-6xl font-light tracking-[0.1em] uppercase">nuuanu</h1><div className="space-y-6"><input type="text" placeholder="ACCESS CODE" className="w-full border-b border-gray-200 py-4 text-center focus:outline-none focus:border-black tracking-[0.075em] uppercase text-sm bg-transparent transition-colors" value={accessCodeInput} onChange={e => setAccessCodeInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleLogin()} autoFocus /><button onClick={handleLogin} className="w-full bg-black text-white py-5 text-[10px] tracking-[0.125em] uppercase font-bold transition-all hover:bg-black/90 active:scale-95 cursor-pointer">Entrance</button></div></div><Toast error={error} success={success} /></div>
            );

            if (view === 'select_collection') return (
                <div className="min-h-screen bg-white p-10 sm:p-20 animate-fade-in"><div className="max-w-6xl mx-auto space-y-16"><div className="flex justify-between items-end border-b border-gray-100 pb-10"><div><h2 className="text-[10px] tracking-[0.1em] uppercase text-grey-medium mb-2">Management</h2><h1 className="text-4xl font-light tracking-normal uppercase">Collections</h1></div><button onClick={handleLogout} className="text-[10px] uppercase tracking-[0.075em] border-b border-black pb-1 transition-colors cursor-pointer">Logout</button></div><div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                    {state.collections.map(c => (
                        <div key={c.id} className="relative group"><div onClick={() => { setActiveCollection(c); setAdminSubView('settings'); setView('admin'); }} className="border border-gray-100 p-12 hover:border-black transition-all cursor-pointer flex flex-col items-center justify-center space-y-6 aspect-square bg-white shadow-sm hover:shadow-xl"><div className="w-16 h-16 bg-transparent flex items-center justify-center rounded-full group-hover:bg-black group-hover:text-white transition-all"><Icons.Package size={24}/></div><div className="text-center font-bold tracking-normal uppercase text-xs">{c.name}</div></div></div>
                    ))}
                    <button onClick={() => setIsCreateModalOpen(true)} className="border border-dashed border-gray-200 p-12 hover:border-black hover:bg-gray-50 flex flex-col items-center justify-center space-y-6 aspect-square group text-gray-300 hover:text-black transition-all cursor-pointer"><Icons.Plus size={24}/><span className="text-[10px] uppercase font-bold">New Catalog</span></button>
                </div></div>
                {isCreateModalOpen && (<div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 px-6 backdrop-blur-sm" onClick={() => setIsCreateModalOpen(false)}><div className="bg-white p-12 w-full max-w-sm shadow-2xl space-y-12 animate-fade-in" onClick={e => e.stopPropagation()}><h3 className="text-xs font-bold uppercase border-b pb-4 text-center tracking-normal">New Seeding Catalog</h3><input autoFocus type="text" placeholder="NAME" className="w-full border-b border-gray-200 py-4 text-center focus:border-black outline-none uppercase text-sm tracking-normal" value={newCollectionName} onChange={e => setNewCollectionName(e.target.value)} onKeyDown={e => e.key === 'Enter' && createCollection(newCollectionName)} /><button onClick={() => createCollection(newCollectionName)} className="w-full bg-black text-white py-5 text-[10px] uppercase font-bold tracking-[0.1em] cursor-pointer">Confirm Create</button></div></div>)}<SyncMonitor /><Toast error={error} success={success} /></div>
            );

            if (view === 'admin' && activeCollection) return (<AdminDashboard collection={activeCollection} collections={state.collections} onUpdate={updateCollection} onBack={() => setView('select_collection')} activeSubView={adminSubView} setSubView={setAdminSubView} notify={notify} adminAccessCode={state.adminAccessCode} updateAdminCode={updateAdminCode} error={error} success={success} onDelete={() => deleteCollection(activeCollection.firebaseId)} />);
            
            if (view === 'influencer' && activeCollection) return (<InfluencerPage collection={activeCollection} cart={cart} setCart={setCart} onLogout={handleLogout} notify={notify} scrollPosRef={scrollPosRef} onSubmission={handleInfluencerSubmission} error={error} success={success} loginCode={accessCodeInput} />);
            
            return null;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
