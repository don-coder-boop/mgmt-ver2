                                        <button onClick={() => setLookIdx(i => (i - 1 + lookImages.length) % lookImages.length)} className="absolute left-3 top-1/2 -translate-y-1/2 bg-white/70 p-2.5 rounded-full shadow"><Icons.ChevronLeft size={20}/></button>
                                        <button onClick={() => setLookIdx(i => (i + 1) % lookImages.length)} className="absolute right-3 top-1/2 -translate-y-1/2 bg-white/70 p-2.5 rounded-full shadow"><Icons.ChevronRight size={20}/></button>
                                        <div className="flex justify-center space-x-2 mt-4">
                                            {lookImages.map((_, i) => (
                                                <button key={i} onClick={() => setLookIdx(i)} className={`w-1.5 h-1.5 rounded-full transition-all ${lookIdx === i ? 'bg-black w-4' : 'bg-gray-200'}`}></button>
                                            ))}
                                        </div>
                                    </React.Fragment>
                                )}
                            </section>
                        )}
                        <section className="max-w-2xl mx-auto text-center space-y-6">
                            <h1 className="text-3xl font-light uppercase tracking-[0.05em]">{coll.descriptionTitle || coll.name}</h1>
                            <p className="text-[14px] text-grey-medium leading-relaxed" style={{whiteSpace: 'pre-line'}}>{coll.descriptionBody}</p>
                        </section>
                        <section className={`grid gap-8 max-w-3xl mx-auto ${isSingleCollectionOnly ? 'grid-cols-1 max-w-md' : 'grid-cols-1 md:grid-cols-2'}`}>
                            <button onClick={() => openSub('main')} className="group text-left space-y-4">
                                <div className="aspect-[4/5] bg-gray-50 overflow-hidden relative">
                                    {coll.coverImageMain 
                                        ? <img src={coll.coverImageMain} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" /> 
                                        : (mainProducts[0] && (mainProducts[0].images||[])[0]) 
                                            ? <img src={mainProducts[0].images[0]} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" />
                                            : <div className="w-full h-full flex items-center justify-center text-gray-200"><Icons.Package size={40}/></div>}
                                </div>
                                <div className="flex justify-between items-center px-1">
                                    <div>
                                        <p className="text-[14px] font-bold uppercase">{subCollectionNameMain}</p>
                                        <p className="text-[10px] uppercase text-grey-medium mt-1">Limit {isUnlimited ? '∞' : `${totalMain}/${limitMain}`}</p>
                                    </div>
                                    <Icons.ChevronRight size={20} className="group-hover:translate-x-1 transition-transform" />
                                </div>
                            </button>
                            {!isSingleCollectionOnly && (
                                <button onClick={() => openSub('underwear')} className="group text-left space-y-4">
                                    <div className="aspect-[4/5] bg-gray-50 overflow-hidden relative">
                                        {coll.coverImageUnderwear 
                                            ? <img src={coll.coverImageUnderwear} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" /> 
                                            : (underwearProducts[0] && (underwearProducts[0].images||[])[0]) 
                                                ? <img src={underwearProducts[0].images[0]} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" />
                                                : <div className="w-full h-full flex items-center justify-center text-gray-200"><Icons.Package size={40}/></div>}
                                    </div>
                                    <div className="flex justify-between items-center px-1">
                                        <div>
                                            <p className="text-[14px] font-bold uppercase">{subCollectionNameUnderwear}</p>
                                            <p className="text-[10px] uppercase text-grey-medium mt-1">Limit {isUnlimited ? '∞' : `${totalUnderwear}/${limitUnderwear}`}</p>
                                        </div>
                                        <Icons.ChevronRight size={20} className="group-hover:translate-x-1 transition-transform" />
                                    </div>
                                </button>
                            )}
                        </section>
                    </main>
                    <Toast error={error} success={success} />
                </div>
            );
        };

        const App = () => {
            const [authReady, setAuthReady] = useState(false);
            const [view, setView] = useState('login'); // login | select_collection | admin | influencer
            const [role, setRole] = useState(null);   // null | 'admin' | 'influencer'
            const [influencerInfo, setInfluencerInfo] = useState(null);
            const [collections, setCollections] = useState([]);
            const [securityMap, setSecurityMap] = useState({});
            const [activeCollectionId, setActiveCollectionId] = useState(null);
            const [activeEntries, setActiveEntries] = useState([]);
            const [influencerCollection, setInfluencerCollection] = useState(null);
            const [activeSubView, setActiveSubView] = useState('settings');
            const [cart, setCart] = useState([]);
            const [accessCodeInput, setAccessCodeInput] = useState('');
            const [loginInstagramId, setLoginInstagramId] = useState('');
            const [isAdminMode, setIsAdminMode] = useState(false);
            const [adminEmail, setAdminEmail] = useState('');
            const [adminPw, setAdminPw] = useState('');
            const [isBusy, setIsBusy] = useState(false);
            const [error, setError] = useState('');
            const [success, setSuccess] = useState('');
            const [showCreateModal, setShowCreateModal] = useState(false);
            const [newCollectionName, setNewCollectionName] = useState('');

            const notify = (msg, type = 'success') => {
                if (type === 'error') { setError(msg); setTimeout(() => setError(''), 4000); }
                else { setSuccess(msg); setTimeout(() => setSuccess(''), 2500); }
            };

            const friendlyError = (err, fallback) => {
                const msg = err && err.message ? err.message : '';
                if (msg && !/internal|INTERNAL/i.test(msg)) return msg;
                return fallback;
            };

            // ── Auth state ──────────────────────────────────────────────
            useEffect(() => {
                const unsub = onAuthStateChanged(auth, async (user) => {
                    if (!user) {
                        setRole(null);
                        setInfluencerInfo(null);
                        setView('login');
                        setAuthReady(true);
                        return;
                    }
                    try {
                        const t = await user.getIdTokenResult();
                        if (t.claims.role === 'admin') {
                            setRole('admin');
                            setView(v => (v === 'login' ? 'select_collection' : v));
                        } else if (t.claims.role === 'influencer' && t.claims.collectionId && t.claims.code && t.claims.instagramId) {
                            // 재방문 시 코드 유효성 + 최신 사용량 재조회 (본인 인스타 아이디 기준)
                            try {
                                const res = await callVerifyAccessCode({ code: t.claims.code, instagramId: t.claims.instagramId });
                                await user.getIdToken(true);
                                setInfluencerInfo(res.data);
                                setRole('influencer');
                                setView(v => (v === 'login' ? 'influencer' : v));
                            } catch (e) {
                                await signOut(auth);
                            }
                        } else if (t.claims.role === 'influencer') {
                            // 이전 버전(인스타 아이디 claim 없음)으로 로그인된 세션 — 재로그인 유도
                            await signOut(auth);
                        }
                    } catch (e) {
                        console.error(e);
                    }
                    setAuthReady(true);
                });
                return unsub;
            }, []);

            // ── Admin subscriptions ─────────────────────────────────────
            useEffect(() => {
                if (role !== 'admin') { setCollections([]); setSecurityMap({}); return; }
                const unsub1 = onSnapshot(collection(db, 'collections'), snap => {
                    const arr = [];
                    snap.forEach(d => arr.push({ ...d.data(), firebaseId: d.id }));
                    arr.sort((a, b) => String(a.name || '').localeCompare(String(b.name || '')));
                    setCollections(arr);
                }, err => {
                    console.error(err);
                    notify('데이터 구독에 실패했습니다. 권한을 확인하세요.', 'error');
                });
                const unsub2 = onSnapshot(collectionGroup(db, 'private'), snap => {
                    const map = {};
                    snap.forEach(d => {
                        if (d.id !== 'security') return;
                        const parent = d.ref.parent.parent;
                        if (parent) map[parent.id] = d.data().accessCodesV2 || [];
                    });
                    setSecurityMap(map);
                }, err => console.error('security subscription:', err));
                return () => { unsub1(); unsub2(); };
            }, [role]);

            // ── Active collection shipping entries (admin) ──────────────
            useEffect(() => {
                if (role !== 'admin' || !activeCollectionId) { setActiveEntries([]); return; }
                const unsub = onSnapshot(collection(db, 'collections', activeCollectionId, 'shippingEntries'), snap => {
                    const arr = [];
                    snap.forEach(d => arr.push({ ...d.data(), id: d.id }));
                    setActiveEntries(arr);
                }, err => console.error('entries subscription:', err));
                return unsub;
            }, [role, activeCollectionId]);

            // ── Influencer collection subscription ──────────────────────
            useEffect(() => {
                if (role !== 'influencer' || !influencerInfo || !influencerInfo.collectionId) { setInfluencerCollection(null); return; }
                const unsub = onSnapshot(doc(db, 'collections', influencerInfo.collectionId), snap => {
                    if (snap.exists()) setInfluencerCollection({ ...snap.data(), firebaseId: snap.id });
                }, err => console.error('influencer subscription:', err));
                return unsub;
            }, [role, influencerInfo && influencerInfo.collectionId]);

            const activeCollection = useMemo(
                () => collections.find(c => c.firebaseId === activeCollectionId) || null,
                [collections, activeCollectionId]
            );

            // ── Login handlers ──────────────────────────────────────────
            const handleInfluencerLogin = async () => {
                const code = accessCodeInput.trim();
                const instagramId = cleanInstaId(loginInstagramId).trim();
                if (!code || !instagramId || isBusy) {
                    if (code && !instagramId) notify('인스타그램 아이디를 입력해주세요.', 'error');
                    return;
                }
                setIsBusy(true);
                try {
                    if (auth.currentUser && !auth.currentUser.isAnonymous) await signOut(auth);
                    if (!auth.currentUser) await signInAnonymously(auth);
                    const res = await callVerifyAccessCode({ code, instagramId });
                    await auth.currentUser.getIdToken(true);
                    setInfluencerInfo(res.data);
                    setRole('influencer');
                    setCart([]);
                    setView('influencer');
                    setAccessCodeInput('');
                    setLoginInstagramId('');
                } catch (err) {
                    console.error(err);
                    notify(friendlyError(err, '유효하지 않은 코드입니다.'), 'error');
                } finally {
                    setIsBusy(false);
                }
            };

            const handleAdminLogin = async () => {
                if (!adminEmail.trim() || !adminPw || isBusy) return;
                setIsBusy(true);
                try {
                    if (auth.currentUser) await signOut(auth);
                    const cred = await signInWithEmailAndPassword(auth, adminEmail.trim(), adminPw);
                    let t = await cred.user.getIdTokenResult();
                    if (t.claims.role !== 'admin') {
                        try {
                            await callBootstrapAdmin({});
                            await cred.user.getIdToken(true);
                            t = await cred.user.getIdTokenResult();
                        } catch (e) { /* fallthrough */ }
                    }
                    if (t.claims.role === 'admin') {
                        setRole('admin');
                        setView('select_collection');
                        setAdminPw('');
                    } else {
                        notify('관리자 권한이 없는 계정입니다. ADMIN_EMAILS 설정을 확인하세요.', 'error');
                        await signOut(auth);
                    }
                } catch (err) {
                    console.error(err);
                    notify('로그인 실패: 이메일 또는 비밀번호를 확인하세요.', 'error');
                } finally {
                    setIsBusy(false);
                }
            };

            const handleLogout = async () => {
                await signOut(auth);
                setRole(null);
                setInfluencerInfo(null);
                setActiveCollectionId(null);
                setCart([]);
                setIsAdminMode(false);
                setView('login');
            };

            // ── Admin data operations ───────────────────────────────────
            const createCollection = async () => {
                const name = newCollectionName.trim();
                if (!name) return;
                setIsBusy(true);
                try {
                    const newColl = {
                        id: generateId(),
                        name,
                        lookbookImages: [],
                        descriptionTitle: 'New Story',
                        descriptionBody: 'Collection inspiration...',
                        products: [],
                        subCollectionNameMain: 'Nuuanu Main Collection',
                        subCollectionNameUnderwear: 'Nuuanu Underwear Collection'
                    };
                    const ref = await addDoc(collection(db, 'collections'), newColl);
                    await setDoc(doc(db, 'collections', ref.id, 'private', 'security'), {
                        accessCodesV2: [{ code: generateId().substring(0, 6), limitMain: 3, limitUnderwear: 2 }]
                    });
                    setShowCreateModal(false);
                    setNewCollectionName('');
                    notify('컬렉션이 생성되었습니다.', 'success');
                } catch (err) {
                    console.error(err);
                    notify('컬렉션 생성 실패', 'error');
                } finally {
                    setIsBusy(false);
                }
            };

            const updateCollectionFields = async (partial) => {
                if (!activeCollectionId) return;
                try {
                    await updateDoc(doc(db, 'collections', activeCollectionId), cleanForFirestore(partial));
                } catch (err) {
                    console.error(err);
                    notify('저장 실패: ' + friendlyError(err, '권한을 확인하세요.'), 'error');
                }
            };

            const updateAccessCodes = async (codes) => {
                if (!activeCollectionId) return;
                try {
                    await setDoc(doc(db, 'collections', activeCollectionId, 'private', 'security'), {
                        accessCodesV2: cleanForFirestore(codes)
                    });
                } catch (err) {
                    console.error(err);
                    notify('코드 저장 실패', 'error');
                }
            };

            const updateEntry = async (entryId, patch) => {
                if (!activeCollectionId) return;
                try {
                    await updateDoc(doc(db, 'collections', activeCollectionId, 'shippingEntries', entryId), cleanForFirestore(patch));
                } catch (err) {
                    console.error(err);
                    notify('저장 실패', 'error');
                }
            };

            const addEntry = async (entry) => {
                if (!activeCollectionId) return;
                try {
                    await addDoc(collection(db, 'collections', activeCollectionId, 'shippingEntries'), cleanForFirestore(entry));
                } catch (err) {
                    console.error(err);
                    notify('추가 실패', 'error');
                }
            };

            const deleteEntry = async (entryId) => {
                if (!activeCollectionId) return;
                try {
                    await deleteDoc(doc(db, 'collections', activeCollectionId, 'shippingEntries', entryId));
                    notify('삭제되었습니다.', 'success');
                } catch (err) {
                    console.error(err);
                    notify('삭제 실패', 'error');
                }
            };

            const bulkUpdateEntries = async (ids, patch) => {
                if (!activeCollectionId || !ids.length) return;
                try {
                    const CHUNK = 400;
                    for (let i = 0; i < ids.length; i += CHUNK) {
                        const batch = writeBatch(db);
                        ids.slice(i, i + CHUNK).forEach(id => {
                            batch.update(doc(db, 'collections', activeCollectionId, 'shippingEntries', id), cleanForFirestore(patch));
                        });
                        await batch.commit();
                    }
                } catch (err) {
                    console.error(err);
                    notify('일괄 저장 실패', 'error');
                }
            };

            const deleteActiveCollection = async () => {
                if (!activeCollectionId) return;
                setIsBusy(true);
                try {
                    await callDeleteCollection({ collectionId: activeCollectionId });
                    setActiveCollectionId(null);
                    setView('select_collection');
                    notify('컬렉션이 삭제되었습니다.', 'success');
                } catch (err) {
                    console.error(err);
                    notify(friendlyError(err, '삭제에 실패했습니다.'), 'error');
                } finally {
                    setIsBusy(false);
                }
            };

            const handleMigrate = async () => {
                if (!confirm('레거시 데이터를 새 보안 구조로 이관합니다.\n(액세스코드 → 보호 저장소, 배송내역 → 서브컬렉션)\n\n이 작업은 재실행해도 안전합니다. 진행할까요?')) return;
                setIsBusy(true);
                try {
                    const res = await callMigrate({});
                    notify(`이관 완료: 컬렉션 ${res.data.migratedCollections}개, 배송내역 ${res.data.migratedEntries}건`, 'success');
                } catch (err) {
                    console.error(err);
                    notify(friendlyError(err, '이관에 실패했습니다.'), 'error');
                } finally {
                    setIsBusy(false);
                }
            };

            // ── Influencer submission ───────────────────────────────────
            const handleInfluencerSubmission = async (payload) => {
                try {
                    const res = await callSubmitOrder(payload);
                    setInfluencerInfo(info => info ? { ...info, usedMain: res.data.usedMain, usedUnderwear: res.data.usedUnderwear } : info);
                    return true;
                } catch (err) {
                    console.error(err);
                    notify(friendlyError(err, '제출에 실패했습니다. 다시 시도해주세요.'), 'error');
                    return false;
                }
            };

            // ── Render ──────────────────────────────────────────────────
            if (!authReady) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-white">
                        <div className="loader"></div>
                    </div>
                );
            }

            if (view === 'login') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 bg-white animate-fade-in">
                        <div className="max-w-md w-full text-center space-y-16">
                            <h1 className="text-5xl font-light tracking-[0.1em] uppercase">nuuanu</h1>
                            {!isAdminMode ? (
                                <div className="space-y-8">
                                    <input 
                                        type="text" 
                                        placeholder="ACCESS CODE" 
                                        value={accessCodeInput}
                                        autoFocus
                                        onChange={e => setAccessCodeInput(e.target.value)}
                                        onKeyDown={e => { if (e.key === 'Enter') handleInfluencerLogin(); }}
                                        className="w-full border-b-2 py-4 text-center text-[16px] uppercase outline-none focus:border-black"
                                    />
                                    <input 
                                        type="text" 
                                        placeholder="INSTAGRAM ID" 
                                        value={loginInstagramId}
                                        onChange={e => setLoginInstagramId(e.target.value)}
                                        onKeyDown={e => { if (e.key === 'Enter') handleInfluencerLogin(); }}
                                        className="w-full border-b-2 py-4 text-center text-[16px] outline-none focus:border-black"
                                    />
                                    <p className="text-[10px] text-grey-light -mt-4"> </p>
                                    <button 
                                        onClick={handleInfluencerLogin} 
                                        disabled={isBusy}
                                        className={`w-full py-5 text-[13px] uppercase font-bold transition-colors ${isBusy ? 'bg-gray-200 text-gray-400' : 'bg-black text-white hover:bg-black/80'}`}
                                    >
                                        {isBusy ? 'Verifying...' : 'Entrance'}
                                    </button>
                                    <button onClick={() => setIsAdminMode(true)} className="text-[9px] uppercase text-gray-300 hover:text-black transition-colors">Admin Login</button>
                                </div>
                            ) : (
                                <div className="space-y-8">
                                    <input 
                                        type="email" 
                                        placeholder="ADMIN EMAIL" 
                                        value={adminEmail}
                                        autoFocus
                                        onChange={e => setAdminEmail(e.target.value)}
                                        className="w-full border-b-2 py-4 text-center text-[14px] outline-none focus:border-black"
                                    />
                                    <input 
                                        type="password" 
                                        placeholder="PASSWORD" 
                                        value={adminPw}
                                        onChange={e => setAdminPw(e.target.value)}
                                        onKeyDown={e => { if (e.key === 'Enter') handleAdminLogin(); }}
                                        className="w-full border-b-2 py-4 text-center text-[14px] outline-none focus:border-black"
                                    />
                                    <button 
                                        onClick={handleAdminLogin} 
                                        disabled={isBusy}
                                        className={`w-full py-5 text-[13px] uppercase font-bold transition-colors ${isBusy ? 'bg-gray-200 text-gray-400' : 'bg-black text-white hover:bg-black/80'}`}
                                    >
                                        {isBusy ? 'Signing In...' : 'Admin Entrance'}
                                    </button>
                                    <button onClick={() => setIsAdminMode(false)} className="text-[9px] uppercase text-gray-300 hover:text-black transition-colors">← Back</button>
                                </div>
                            )}
                        </div>
                        <Toast error={error} success={success} />
                    </div>
                );
            }

            if (view === 'select_collection' && role === 'admin') {
                return (
                    <div className="min-h-screen bg-white p-12 animate-fade-in">
                        <header className="flex justify-between items-center mb-16 border-b pb-8">
                            <h1 className="text-2xl font-light tracking-[0.1em] uppercase">nuuanu · Collections</h1>
                            <div className="flex items-center space-x-8">
                                <button onClick={handleMigrate} disabled={isBusy} className="text-[10px] uppercase font-bold text-gray-300 hover:text-black transition-colors">Migrate Legacy Data</button>
                                <button onClick={handleLogout} className="text-[12px] uppercase font-bold flex items-center hover:text-gray-400"><Icons.LogOut size={16} className="mr-2"/> Logout</button>
                            </div>
                        </header>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8 max-w-7xl mx-auto">
                            {collections.map(c => (
                                <button 
                                    key={c.firebaseId} 
                                    onClick={() => { setActiveCollectionId(c.firebaseId); setActiveSubView('settings'); setView('admin'); }}
                                    className="border-2 p-10 text-left hover:border-black transition-all group space-y-4"
                                >
                                    <h2 className="text-[16px] font-bold uppercase tracking-wide group-hover:translate-x-1 transition-transform">{c.name}</h2>
                                    <p className="text-[11px] text-grey-medium uppercase">{(c.products || []).length} products · {(securityMap[c.firebaseId] || []).length} codes</p>
                                </button>
                            ))}
                            <button 
                                onClick={() => setShowCreateModal(true)}
                                className="border-2 border-dashed p-10 flex flex-col items-center justify-center space-y-3 text-gray-300 hover:text-black hover:border-black transition-all"
                            >
                                <Icons.Plus size={28} />
                                <span className="text-[11px] uppercase font-bold">New Collection</span>
                            </button>
                        </div>
                        {showCreateModal && (
                            <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-6" onClick={() => setShowCreateModal(false)}>
                                <div className="bg-white p-12 max-w-md w-full space-y-8" onClick={e => e.stopPropagation()}>
                                    <h3 className="text-[14px] font-bold uppercase tracking-[0.1em]">New Collection</h3>
                                    <input 
                                        type="text" 
                                        placeholder="COLLECTION NAME" 
                                        value={newCollectionName}
                                        autoFocus
                                        onChange={e => setNewCollectionName(e.target.value)}
                                        onKeyDown={e => { if (e.key === 'Enter') createCollection(); }}
                                        className="w-full border-b-2 py-4 text-[14px] uppercase outline-none focus:border-black"
                                    />
                                    <div className="flex space-x-4">
                                        <button onClick={createCollection} disabled={isBusy} className="flex-1 bg-black text-white py-4 text-[12px] uppercase font-bold">Create</button>
                                        <button onClick={() => setShowCreateModal(false)} className="flex-1 border-2 py-4 text-[12px] uppercase font-bold">Cancel</button>
                                    </div>
                                </div>
                            </div>
                        )}
                        <SyncMonitor />
                        <Toast error={error} success={success} />
                    </div>
                );
            }

            if (view === 'admin' && role === 'admin' && activeCollection) {
                return (
                    <AdminDashboard 
                        collection={activeCollection}
                        collections={collections}
                        securityMap={securityMap}
                        accessCodes={securityMap[activeCollection.firebaseId] || []}
                        entries={activeEntries}
                        onUpdate={updateCollectionFields}
                        onUpdateCodes={updateAccessCodes}
                        onUpdateEntry={updateEntry}
                        onAddEntry={addEntry}
                        onDeleteEntry={deleteEntry}
                        onBulkUpdateEntries={bulkUpdateEntries}
                        onBack={() => { setActiveCollectionId(null); setView('select_collection'); }}
                        activeSubView={activeSubView}
                        setSubView={setActiveSubView}
                        notify={notify}
                        onDelete={deleteActiveCollection}
                        error={error}
                        success={success}
                    />
                );
            }

            if (view === 'influencer' && role === 'influencer') {
                if (!influencerCollection) {
                    return (
                        <div className="min-h-screen flex items-center justify-center bg-white">
                            <div className="loader"></div>
                        </div>
                    );
                }
                return (
                    <InfluencerPage 
                        collection={influencerCollection}
                        cart={cart}
                        setCart={setCart}
                        onLogout={handleLogout}
                        notify={notify}
                        onSubmission={handleInfluencerSubmission}
                        error={error}
                        success={success}
                        influencerInfo={influencerInfo}
                    />
                );
            }

            // Fallback
            return (
                <div className="min-h-screen flex items-center justify-center bg-white">
                    <div className="loader"></div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
